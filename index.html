<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Soph's Lists</title>
<link rel="icon" href="icon.png"/>
<link rel="apple-touch-icon" href="icon.png"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="Lists"/>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap');

:root{
  --bg:#f4f1ec;
  --card:#fff;
  --ink:#18140f;
  --ink2:#4a3c30;
  --ink3:#9a8878;
  --ink4:#c8b8a8;
  --sh:rgba(60,40,10,.08);
  --sh2:rgba(60,40,10,.04);
  --r:18px;

  /* tab accent colours */
  --today-c:#e05a2b;   --today-l:#f07848;  --today-bg:#fef2ec;
  --work-c:#3a6ea8;    --work-l:#5a8ec8;   --work-bg:#eaf1fb;
  --errands-c:#c0507a; --errands-l:#da6a94;--errands-bg:#fcedf3;
  --projects-c:#7a50c0;--projects-l:#9870e0;--projects-bg:#f2edfb;
  --grocery-c:#2a9060; --grocery-l:#3aaa74;--grocery-bg:#e8f5ee;
  --fun-c:#d4880a;     --fun-l:#f0a030;    --fun-bg:#fef6e4;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{font-family:'DM Sans',-apple-system,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100vh;overscroll-behavior:none}
button,input,textarea,select{font-family:inherit}
input,textarea{user-select:text}

/* ── SHELL ─────────────────────────────────────────── */
#app{max-width:430px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;overflow:hidden}

/* ── HEADER ────────────────────────────────────────── */
.hdr{
  flex-shrink:0;
  padding:56px 20px 0;
  background:var(--bg);
  position:relative;z-index:15
}
.hdr-inner{
  display:flex;align-items:center;justify-content:space-between;
  padding-bottom:16px;
  border-bottom:1px solid rgba(0,0,0,.07);
  margin-bottom:0
}
/* logo mark */
.hdr-logo{
  width:38px;height:38px;border-radius:12px;
  background:linear-gradient(145deg,var(--ac-l,#f07848),var(--ac,#e05a2b));
  box-shadow:0 3px 12px rgba(0,0,0,.18);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
  transition:background .3s
}
.hdr-logo-inner{
  width:18px;height:18px;position:relative;
}
/* three stacked lines — universal list icon */
.hdr-logo-inner::before,
.hdr-logo-inner::after,
.hdr-logo-line{
  content:'';display:block;position:absolute;
  height:2.5px;border-radius:2px;background:#fff;left:0;right:0;
  transition:all .2s
}
.hdr-logo-inner::before{top:0;right:5px}
.hdr-logo-line{top:50%;transform:translateY(-50%)}
.hdr-logo-inner::after{bottom:0;right:2px}

/* date + status */
.hdr-meta{flex:1;padding:0 14px}
.hdr-day{
  font-family:'Playfair Display',Georgia,serif;
  font-size:22px;font-weight:400;font-style:italic;
  color:var(--ink);line-height:1;margin-bottom:2px
}
.hdr-status{font-size:12px;font-weight:600;color:var(--ink3)}
.hdr-status b{color:var(--ac,#e05a2b);font-weight:800}

/* search btn */
.hdr-btn{
  width:36px;height:36px;border-radius:50%;border:none;
  background:rgba(255,255,255,.9);
  box-shadow:0 2px 8px var(--sh);
  cursor:pointer;font-size:16px;
  display:flex;align-items:center;justify-content:center;
  transition:all .15s;flex-shrink:0
}
.hdr-btn:hover{background:#fff;box-shadow:0 4px 12px var(--sh)}
.hdr-btn.active{background:var(--ac,#e05a2b);color:#fff;box-shadow:0 3px 10px rgba(0,0,0,.2)}
/* hide old sub line */
.hdr-sub{display:none}
.hdr-date{display:none}

/* search */
.search-wrap{overflow:hidden;max-height:0;transition:max-height .25s cubic-bezier(.4,0,.2,1),margin .25s}
.search-wrap.open{max-height:60px;margin-bottom:14px}
.search-row{position:relative}
.search-inp{width:100%;background:#fff;border:1.5px solid rgba(0,0,0,.08);border-radius:14px;padding:11px 14px 11px 40px;font-size:15px;color:var(--ink);outline:none;box-shadow:0 2px 8px var(--sh2);transition:border-color .15s}
.search-inp:focus{border-color:var(--ac,#e05a2b)}
.search-ic{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:16px;pointer-events:none}

/* ── SCROLL ────────────────────────────────────────── */
.scroll{flex:1;overflow-y:auto;padding:14px 20px 30px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}

/* ── EMPTY ─────────────────────────────────────────── */
.empty{text-align:center;padding:70px 20px}
.empty-em{font-size:52px;margin-bottom:14px}
.empty-t{font-family:'Playfair Display',Georgia,serif;font-size:22px;font-style:italic;color:var(--ink3);margin-bottom:6px}
.empty-s{font-size:14px;color:var(--ink4)}

/* ── TASK ITEM ─────────────────────────────────────── */
.task-wrap{position:relative;margin-bottom:8px;border-radius:var(--r)}
.swipe-hint{position:absolute;inset:0;border-radius:var(--r);display:flex;align-items:center;pointer-events:none;opacity:0;transition:opacity .12s}
.swipe-done{background:linear-gradient(90deg,#2a9060,#3aaa74);justify-content:flex-start;padding-left:22px}
.swipe-del {background:linear-gradient(270deg,#d03030,#e05050);justify-content:flex-end;padding-right:22px}
.swipe-icon{font-size:22px;color:#fff}

.task{background:var(--card);border-radius:var(--r);border:1.5px solid rgba(0,0,0,.05);box-shadow:0 2px 10px var(--sh2);position:relative;z-index:1;touch-action:pan-y;will-change:transform;transition:box-shadow .2s}
.task.dragging{box-shadow:0 14px 40px rgba(0,0,0,.18);z-index:50;opacity:.96;border-color:rgba(0,0,0,.1)}
.task.done-anim{animation:doneAnim .35s cubic-bezier(.34,1.56,.64,1)}
@keyframes doneAnim{0%{transform:scale(1)}50%{transform:scale(1.025)}100%{transform:scale(1)}}

.task-body{display:flex;align-items:flex-start;gap:11px;padding:15px 14px 13px 16px}
.t-check{width:26px;height:26px;border-radius:50%;flex-shrink:0;margin-top:1px;border:2px solid var(--ink4);background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .22s cubic-bezier(.34,1.56,.64,1)}
.task.done .t-check{background:var(--ac,#e05a2b);border-color:var(--ac,#e05a2b);box-shadow:0 2px 8px rgba(0,0,0,.18)}
.t-tick{opacity:0;transform:scale(0);transition:all .2s cubic-bezier(.34,1.56,.64,1)}
.task.done .t-tick{opacity:1;transform:scale(1)}
.t-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:9px}
.p-high .t-dot{background:#e04040}
.p-med  .t-dot{background:#e09030}
.p-low  .t-dot{background:var(--ink4)}
.t-info{flex:1;min-width:0;cursor:pointer}
.t-title{font-size:15px;font-weight:600;color:var(--ink);line-height:1.35;transition:color .2s}
.task.done .t-title{text-decoration:line-through;text-decoration-color:var(--ink4);color:var(--ink3)}
.t-meta{display:flex;align-items:center;gap:6px;margin-top:5px;flex-wrap:wrap}
.t-note{font-size:12px;color:var(--ink3);font-style:italic;margin-top:3px;line-height:1.4}
.task.done .t-note{text-decoration:line-through;text-decoration-color:var(--ink4)}
.pri-badge{font-size:10px;font-weight:700;border-radius:7px;padding:2px 8px;text-transform:uppercase;letter-spacing:.04em}
.p-high .pri-badge{background:rgba(224,64,64,.1);color:#c03030}
.p-med  .pri-badge{background:rgba(224,144,48,.1);color:#b06820}
.p-low  .pri-badge{background:rgba(0,0,0,.06);color:var(--ink3)}
.rec-badge{font-size:10px;color:var(--ink4);font-weight:600}
.due-badge{font-size:11px;font-weight:700;border-radius:7px;padding:2px 8px}
.due-today{background:rgba(224,90,43,.12);color:#c04020}
.due-soon {background:rgba(224,144,48,.1);color:#b06820}
.due-late {background:rgba(200,40,40,.12);color:#c02020}
.t-drag{font-size:16px;color:var(--ink4);padding:4px 2px;cursor:grab;flex-shrink:0;margin-top:1px;touch-action:none}
.t-drag:active{cursor:grabbing}

/* done collapse */
.done-sec{margin-top:14px}
.done-hdr{display:flex;align-items:center;gap:8px;background:none;border:none;cursor:pointer;width:100%;padding:6px 0;transition:opacity .15s}
.done-hdr:hover{opacity:.75}
.done-arrow{font-size:12px;transition:transform .2s;color:var(--ink3)}
.done-arrow.open{transform:rotate(90deg)}
.done-lbl{font-size:13px;font-weight:700;color:var(--ink3)}
.done-count{background:rgba(0,0,0,.08);color:var(--ink3);font-size:10px;font-weight:800;border-radius:10px;padding:1px 7px}
.done-clear{margin-left:auto;font-size:12px;font-weight:700;color:var(--ink4);text-decoration:underline;text-underline-offset:2px;cursor:pointer;background:none;border:none}
.done-list{display:none}
.done-list.open{display:block}

/* ── ADD BAR ───────────────────────────────────────── */
.add-bar{
  position:absolute;bottom:72px;left:0;right:0;
  padding:8px 20px 10px;
  background:linear-gradient(transparent,var(--bg) 28%);
  z-index:20;pointer-events:none
}
.add-pill{
  display:flex;align-items:center;gap:8px;
  background:var(--card);border-radius:22px;
  border:1.5px solid rgba(0,0,0,.07);
  box-shadow:0 6px 28px var(--sh),0 2px 6px var(--sh2);
  padding:8px 8px 8px 16px;pointer-events:all
}
.add-inp{flex:1;background:transparent;border:none;outline:none;font-size:16px;color:var(--ink)}
.add-inp::placeholder{color:var(--ink4)}
.add-pri-btns{display:flex;gap:3px;flex-shrink:0}
.apb{width:28px;height:28px;border-radius:9px;border:none;font-size:12px;font-weight:800;cursor:pointer;transition:all .15s;background:transparent;color:var(--ink4)}
.apb:hover{background:rgba(0,0,0,.06)}
.apb.on-high{background:rgba(224,64,64,.15);color:#e04040}
.apb.on-med {background:rgba(224,144,48,.15);color:#e09030}
.apb.on-low {background:rgba(0,0,0,.08);color:var(--ink3)}
.add-go{width:38px;height:38px;border-radius:14px;border:none;background:linear-gradient(145deg,var(--ac-l,#f07848),var(--ac,#e05a2b));color:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(0,0,0,.2);flex-shrink:0;transition:all .15s}
.add-go:hover{transform:scale(1.07)}

/* ── BOTTOM NAV ────────────────────────────────────── */
.nav{
  flex-shrink:0;height:72px;
  display:flex;align-items:stretch;
  background:rgba(255,255,255,.95);
  backdrop-filter:blur(20px);
  border-top:1px solid rgba(0,0,0,.07);
  box-shadow:0 -4px 20px var(--sh2);
  padding:0 4px;padding-bottom:env(safe-area-inset-bottom,0)
}
.nav-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;border:none;background:transparent;cursor:pointer;
  padding:8px 2px;border-radius:16px;transition:all .2s;
  position:relative
}
.nav-btn:active{transform:scale(.94)}
.nav-icon{font-size:22px;line-height:1;transition:transform .2s}
.nav-btn.active .nav-icon{transform:scale(1.15)}
.nav-label{font-size:9px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink4);transition:color .2s}
.nav-btn.active .nav-label{color:var(--ac,#e05a2b)}
.nav-dot{width:5px;height:5px;border-radius:50%;background:var(--ac,#e05a2b);position:absolute;top:6px;right:calc(50% - 18px);opacity:0;transition:opacity .2s}
.nav-dot.show{opacity:1}
/* active tab indicator */
.nav-btn::after{content:'';position:absolute;bottom:0;left:20%;right:20%;height:3px;border-radius:2px 2px 0 0;background:var(--ac,#e05a2b);opacity:0;transition:opacity .2s}
.nav-btn.active::after{opacity:1}

/* ── EDIT SHEET ────────────────────────────────────── */
.overlay{position:fixed;inset:0;background:rgba(10,5,0,.42);backdrop-filter:blur(5px);z-index:100;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .22s}
.overlay.open{opacity:1;pointer-events:all}
.sheet{background:var(--card);border-radius:28px 28px 0 0;width:100%;max-width:430px;padding:0 22px 52px;max-height:92vh;overflow-y:auto;transform:translateY(100%);box-shadow:0 -8px 40px rgba(0,0,0,.12);transition:transform .3s cubic-bezier(.32,0,.67,0)}
.overlay.open .sheet{transform:translateY(0);transition:transform .36s cubic-bezier(.33,1,.68,1)}
.sh-handle{width:44px;height:4px;background:#e0d8d0;border-radius:3px;margin:15px auto 22px}
.sh-title{font-family:'Playfair Display',Georgia,serif;font-size:24px;font-style:italic;color:var(--ink);margin-bottom:20px}
.fi{width:100%;background:#faf8f4;border:1.5px solid rgba(0,0,0,.09);border-radius:13px;padding:13px 14px;font-size:15px;color:var(--ink);outline:none;transition:border-color .15s}
.fi:focus{border-color:var(--ac,#e05a2b);box-shadow:0 0 0 3px rgba(0,0,0,.05)}
.fi::placeholder{color:var(--ink4)}
textarea.fi{resize:none;min-height:78px;line-height:1.6}
.fw{margin-bottom:16px}
.fl{font-size:10px;font-weight:700;color:var(--ink3);letter-spacing:.14em;text-transform:uppercase;margin-bottom:7px}
.pri-row{display:flex;gap:8px;margin-bottom:18px}
.pri-opt{flex:1;padding:11px 8px;border-radius:12px;border:2px solid rgba(0,0,0,.08);background:#faf8f4;font-size:13px;font-weight:700;color:var(--ink3);cursor:pointer;text-align:center;transition:all .15s}
.pri-opt.sh{border-color:currentColor}
.pri-opt.s-high{background:rgba(224,64,64,.1);border-color:rgba(224,64,64,.35);color:#c03030}
.pri-opt.s-med {background:rgba(224,144,48,.1);border-color:rgba(224,144,48,.35);color:#b06820}
.pri-opt.s-low {background:rgba(0,0,0,.07);border-color:rgba(0,0,0,.15);color:var(--ink3)}
.rec-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.rec-opt{padding:9px 16px;border-radius:20px;border:1.5px solid rgba(0,0,0,.1);background:#faf8f4;font-size:13px;font-weight:600;color:var(--ink3);cursor:pointer;transition:all .15s}
.rec-opt.sel{background:var(--ac-bg,#fef2ec);border-color:var(--ac,#e05a2b);color:var(--ac,#e05a2b)}
.brow{display:flex;gap:10px;margin-top:4px}
.bs{padding:12px 20px;width:auto;border-radius:12px;border:none;font-size:14px;font-weight:700;cursor:pointer;transition:all .15s}
.bs-p{background:linear-gradient(145deg,var(--ac-l,#f07848),var(--ac,#e05a2b));color:#fff;box-shadow:0 3px 10px rgba(0,0,0,.15)}
.bs-p:hover{transform:translateY(-1px)}
.bs-g{background:rgba(0,0,0,.07);color:var(--ink3)}
.del-b{width:100%;padding:13px;border-radius:12px;border:1.5px solid rgba(200,50,50,.2);background:rgba(200,50,50,.06);color:#c04040;font-size:14px;font-weight:700;cursor:pointer;margin-top:14px;transition:all .15s}
.del-b:hover{background:rgba(200,50,50,.12)}

/* ── GROCERY TAB ───────────────────────────────────── */
.groc-wrap{padding-bottom:10px}
.groc-section{margin-bottom:24px}
.groc-sec-title{font-size:10px;font-weight:800;color:var(--ink3);letter-spacing:.16em;text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.groc-sec-title::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(42,144,96,.2),transparent)}
.groc-grid{display:flex;flex-direction:column;gap:7px}

.groc-item{
  background:var(--card);border-radius:16px;
  border:1.5px solid rgba(0,0,0,.05);
  box-shadow:0 2px 8px var(--sh2);
  display:flex;align-items:center;gap:0;
  overflow:hidden;transition:all .2s
}
.groc-item.in-cart{background:linear-gradient(135deg,#eaf6ee,#e0f2e8);border-color:rgba(42,144,96,.2)}
.groc-item.in-cart .gi-name{color:var(--ink3);text-decoration:line-through;text-decoration-color:rgba(42,144,96,.4)}

.gi-emoji{font-size:22px;padding:13px 2px 13px 14px;flex-shrink:0;line-height:1}
.gi-info{flex:1;padding:13px 10px 13px 8px;min-width:0;cursor:pointer}
.gi-name{font-size:15px;font-weight:600;color:var(--ink);transition:all .2s}
.gi-sub{font-size:11px;color:var(--ink4);margin-top:2px}

.gi-qty{display:flex;align-items:center;gap:0;flex-shrink:0;padding:0 10px}
.qty-btn{width:32px;height:32px;border-radius:10px;border:none;background:transparent;font-size:20px;cursor:pointer;color:var(--ink3);display:flex;align-items:center;justify-content:center;transition:all .15s;font-weight:300;line-height:1}
.qty-btn:hover{background:rgba(42,144,96,.1);color:var(--grocery-c)}
.qty-btn:active{transform:scale(.9)}
.qty-btn.qty-plus{color:var(--grocery-c);font-weight:600}
.qty-num{
  font-family:'Playfair Display',Georgia,serif;
  font-size:22px;font-weight:400;color:var(--ink);
  min-width:28px;text-align:center;line-height:1;
  transition:all .2s
}
.qty-num.highlight{color:var(--grocery-c);animation:qtyPop .25s cubic-bezier(.34,1.56,.64,1)}
@keyframes qtyPop{0%{transform:scale(1)}50%{transform:scale(1.3)}100%{transform:scale(1)}}
.qty-num.zero{color:var(--ink4)}

.groc-clear{
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;padding:13px;border-radius:14px;border:1.5px dashed rgba(42,144,96,.25);
  background:transparent;color:var(--grocery-c);font-size:14px;font-weight:700;
  cursor:pointer;margin-top:8px;transition:all .15s
}
.groc-clear:hover{background:rgba(42,144,96,.06)}

.cart-summary{
  background:linear-gradient(145deg,#2a9060,#1a7a50);
  border-radius:16px;padding:14px 18px;margin-bottom:16px;
  display:flex;align-items:center;justify-content:space-between;
  box-shadow:0 4px 16px rgba(42,144,96,.25)
}
.cart-txt{font-size:14px;font-weight:700;color:#fff}
.cart-sub{font-size:12px;color:rgba(255,255,255,.7);margin-top:2px}
.cart-count{font-family:'Playfair Display',Georgia,serif;font-size:42px;font-weight:300;color:#fff;line-height:1}

/* custom grocery item add */
.groc-add-row{display:flex;gap:8px;margin-top:10px}
.groc-add-inp{flex:1;background:#fff;border:1.5px solid rgba(42,144,96,.2);border-radius:12px;padding:11px 14px;font-size:14px;color:var(--ink);outline:none;transition:border-color .15s}
.groc-add-inp:focus{border-color:var(--grocery-c)}
.groc-add-btn{background:linear-gradient(145deg,#3aaa74,#2a9060);color:#fff;border:none;border-radius:12px;padding:11px 18px;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 2px 8px rgba(42,144,96,.25);transition:all .15s;white-space:nowrap}
.groc-add-btn:hover{transform:translateY(-1px)}

/* ── CONFETTI ──────────────────────────────────────── */
@keyframes cf{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}
.cf{position:fixed;top:-10px;border-radius:3px;pointer-events:none;z-index:300;animation:cf linear both}

/* ── TOAST ─────────────────────────────────────────── */
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px) scale(.85);z-index:200;background:rgba(30,24,16,.9);backdrop-filter:blur(10px);color:#fff;border-radius:20px;padding:12px 22px;font-size:14px;font-weight:600;opacity:0;transition:all .35s cubic-bezier(.34,1.56,.64,1);pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}

/* ── TODAY HEADER CHIPS ────────────────────────────── */
.today-chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;margin-bottom:14px;scrollbar-width:none}
.today-chips::-webkit-scrollbar{display:none}
.t-chip{flex-shrink:0;padding:7px 14px;border-radius:20px;border:1.5px solid rgba(0,0,0,.08);background:#fff;font-size:13px;font-weight:700;color:var(--ink3);cursor:pointer;transition:all .15s;box-shadow:0 1px 4px var(--sh2)}
.t-chip.active{color:#fff;border-color:transparent;box-shadow:0 2px 8px rgba(0,0,0,.15)}

/* ── ADMIN SECTIONS ────────────────────────────────── */
.admin-section{margin-bottom:28px}
.admin-sec-hdr{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.admin-sec-icon{font-size:18px}
.admin-sec-title{font-family:'Playfair Display',Georgia,serif;font-size:22px;font-style:italic;color:var(--ink);font-weight:400;flex:1}
.admin-sec-count{background:var(--ac,#c0507a);color:#fff;font-size:10px;font-weight:800;border-radius:10px;padding:2px 8px;min-width:22px;text-align:center}
.admin-empty{font-size:13px;color:var(--ink4);font-style:italic;padding:10px 4px 14px;font-family:'Playfair Display',Georgia,serif}
.admin-add-row{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.7);border-radius:14px;border:1.5px dashed rgba(0,0,0,.1);padding:8px 8px 8px 14px;margin-top:8px}
.admin-add-inp{flex:1;background:transparent;border:none;outline:none;font-size:15px;color:var(--ink)}
.admin-add-inp::placeholder{color:var(--ink4)}
.admin-add-pris{display:flex;gap:3px;flex-shrink:0}
.admin-add-btn{width:32px;height:32px;border-radius:10px;border:none;background:linear-gradient(145deg,var(--ac-l,#da6a94),var(--ac,#c0507a));color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.15)}
</style>
</head>
<body>

<div id="app">
  <div class="hdr" id="hdr">
    <div class="hdr-inner">
      <!-- logo mark -->
      <div class="hdr-logo" id="hdr-logo">
        <div class="hdr-logo-inner">
          <span class="hdr-logo-line"></span>
        </div>
      </div>
      <!-- date + status -->
      <div class="hdr-meta">
        <div class="hdr-day" id="hdr-day"></div>
        <div class="hdr-status" id="hdr-status"></div>
      </div>
      <!-- search -->
      <button class="hdr-btn" id="search-btn" onclick="toggleSearch()" title="Search">🔍</button>
    </div>
    <!-- keep these hidden for JS compat -->
    <div class="hdr-sub" id="hdr-sub" style="display:none"></div>
    <div class="hdr-date" id="hdr-date" style="display:none"></div>
    <div class="search-wrap" id="search-wrap">
      <div class="search-row" style="margin-top:12px">
        <span class="search-ic">🔍</span>
        <input class="search-inp" id="search-inp" placeholder="Search all lists…" oninput="onSearch()" onkeydown="if(event.key==='Escape')toggleSearch()"/>
      </div>
    </div>
  </div>

  <div class="scroll" id="scroll"></div>

  <!-- Add bar (hidden on grocery/today) -->
  <div class="add-bar" id="add-bar">
    <div class="add-pill">
      <input class="add-inp" id="add-inp" placeholder="Add a task…" onkeydown="if(event.key==='Enter')addTask()"/>
      <div class="add-pri-btns">
        <button class="apb on-high" id="apb-high" onclick="setPri('high')" title="High priority">!</button>
        <button class="apb" id="apb-med"  onclick="setPri('med')"  title="Medium">–</button>
        <button class="apb" id="apb-low"  onclick="setPri('low')"  title="Low">·</button>
      </div>
      <button class="add-go" onclick="addTask()">+</button>
    </div>
  </div>

  <!-- Bottom nav -->
  <div class="nav" id="nav">
    <button class="nav-btn" data-tab="today"   onclick="go('today')">   <span class="nav-icon">☀️</span><span class="nav-label">Today</span>  <span class="nav-dot" id="nd-today"></span></button>
    <button class="nav-btn" data-tab="work"    onclick="go('work')">    <span class="nav-icon">💼</span><span class="nav-label">Work</span>   <span class="nav-dot" id="nd-work"></span></button>
    <button class="nav-btn" data-tab="admin"   onclick="go('admin')">   <span class="nav-icon">📋</span><span class="nav-label">Life Admin</span><span class="nav-dot" id="nd-admin"></span></button>
    <button class="nav-btn" data-tab="grocery" onclick="go('grocery')"> <span class="nav-icon">🛒</span><span class="nav-label">Grocery</span><span class="nav-dot" id="nd-grocery"></span></button>
    <button class="nav-btn" data-tab="fun"     onclick="go('fun')">     <span class="nav-icon">✨</span><span class="nav-label">Fun</span>    <span class="nav-dot" id="nd-fun"></span></button>
  </div>
</div>

<!-- Edit sheet -->
<div class="overlay" id="sh-edit" onclick="maybeClose(event,'sh-edit')">
  <div class="sheet">
    <div class="sh-handle"></div>
    <div class="sh-title">Edit task</div>
    <div class="fw"><div class="fl">Task</div><input type="text" class="fi" id="et-title" placeholder="Task…"/></div>
    <div class="fw"><div class="fl">Priority</div>
      <div class="pri-row">
        <button class="pri-opt" id="ep-high" onclick="setEPri('high')">🔴 High</button>
        <button class="pri-opt" id="ep-med"  onclick="setEPri('med')">🟠 Med</button>
        <button class="pri-opt" id="ep-low"  onclick="setEPri('low')">⚪ Low</button>
      </div>
    </div>
    <div class="fw"><div class="fl">Due date <span style="color:var(--ink4);font-weight:400;text-transform:none;letter-spacing:0;font-size:12px">optional</span></div>
      <input type="date" class="fi" id="et-due"/>
    </div>
    <div class="fw"><div class="fl">Repeat</div>
      <div class="rec-row" id="rec-row"></div>
    </div>
    <div class="fw"><div class="fl">Notes <span style="color:var(--ink4);font-weight:400;text-transform:none;letter-spacing:0;font-size:12px">optional</span></div>
      <textarea class="fi" id="et-note" rows="3" placeholder="Any details…"></textarea>
    </div>
    <div class="brow">
      <button class="bs bs-g" onclick="closeSheet('sh-edit')">Cancel</button>
      <button class="bs bs-p" style="flex:1" onclick="saveEdit()">Save</button>
    </div>
    <button class="del-b" onclick="delTask()">Delete task</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
'use strict';
const SK = 'soph-lists-v2';

// ── TABS CONFIG ───────────────────────────────────────
const TABS = {
  today:  {label:'Today',      icon:'☀️', ac:'#e05a2b', acL:'#f07848', acBg:'#fef2ec'},
  work:   {label:'Work',       icon:'💼', ac:'#3a6ea8', acL:'#5a8ec8', acBg:'#eaf1fb'},
  admin:  {label:'Life Admin', icon:'📋', ac:'#c0507a', acL:'#da6a94', acBg:'#fcedf3'},
  grocery:{label:'Grocery',    icon:'🛒', ac:'#2a9060', acL:'#3aaa74', acBg:'#e8f5ee'},
  fun:    {label:'Fun',        icon:'✨', ac:'#d4880a', acL:'#f0a030', acBg:'#fef6e4'},
};

// Life Admin has two sub-lists
const ADMIN_SECTIONS = [
  {id:'errands',  label:'Errands & Quick Wins', icon:'⚡'},
  {id:'projects', label:'Projects & Big Stuff',  icon:'🗂'},
];

const REC_OPTS = ['None','Daily','Weekly','Monthly'];

// ── GROCERY FAVOURITES ────────────────────────────────
const GROC_SECTIONS = [
  {name:'Fruit & Veg', items:[
    {id:'g-apples',  name:'Green apples',    emoji:'🍏'},
    {id:'g-grapes',  name:'Grapes',          emoji:'🍇'},
    {id:'g-herbs',   name:'Herbs',           emoji:'🌿'},
    {id:'g-berries', name:'Berries',         emoji:'🫐'},
    {id:'g-toms',    name:'Tomatoes',        emoji:'🍅'},
    {id:'g-cuke',    name:'Cucumber',        emoji:'🥒'},
    {id:'g-swpot',   name:'Sweet potato',    emoji:'🍠'},
    {id:'g-rocket',  name:'Rocket',          emoji:'🥬'},
    {id:'g-ice',     name:'Iceberg lettuce', emoji:'🥬'},
  ]},
  {name:'Protein', items:[
    {id:'g-salmon', name:'Salmon fillets',  emoji:'🐟', defaultQty:4},
    {id:'g-beef',   name:'Lean beef mince', emoji:'🥩'},
    {id:'g-chkn',   name:'Chicken mince',   emoji:'🍗'},
    {id:'g-tuna',   name:'Tuna',            emoji:'🐟'},
    {id:'g-eggs',   name:'Eggs',            emoji:'🥚'},
  ]},
  {name:'Dairy & Fridge', items:[
    {id:'g-chob',   name:'Chobani Fit',   emoji:'🥛'},
    {id:'g-butter', name:'Butter',        emoji:'🧈'},
    {id:'g-milk',   name:'Milk',          emoji:'🥛'},
  ]},
  {name:'Pantry & Snacks', items:[
    {id:'g-pow',   name:'Powerade',     emoji:'💧'},
    {id:'g-jelly', name:'Jelly snakes', emoji:'🐍'},
    {id:'g-pb',    name:'Peanut butter',emoji:'🥜'},
    {id:'g-vege',  name:'Vegemite',     emoji:'🫙'},
    {id:'g-crus',  name:'Cruskits',     emoji:'🍞'},
    {id:'g-vita',  name:'Vitaweats',    emoji:'🍘'},
  ]},
];

// ── STATE ─────────────────────────────────────────────
let S = {
  tasks: {work:[], errands:[], projects:[], fun:[]},
  grocery: {}, // {itemId: qty}  0 = not in cart
  doneOpen: {},
  customGrocery: [], // [{id,name,emoji,qty}]
};
let tab      = 'today';
let addPri   = 'high';
let editId   = null;
let editTab  = null;
let editPri  = 'high';
let editRec  = 'None';
let doneOpen = {};
let searchQ  = '';

// ── STORAGE ───────────────────────────────────────────
function load(){ try{ const d=JSON.parse(localStorage.getItem(SK)); if(d){ S={...S,...d}; doneOpen=S.doneOpen||{}; } }catch{} }
function save(){ try{ S.doneOpen=doneOpen; localStorage.setItem(SK,JSON.stringify(S)); }catch{} }

// ── THEME ─────────────────────────────────────────────
function theme(t){
  const cfg = TABS[t]||TABS.today;
  document.documentElement.style.setProperty('--ac',   cfg.ac);
  document.documentElement.style.setProperty('--ac-l', cfg.acL);
  document.documentElement.style.setProperty('--ac-bg',cfg.acBg);
}

// ── NAV ───────────────────────────────────────────────
function go(t){
  tab = t;
  theme(t);
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));
  document.getElementById('add-bar').style.display = (t==='grocery'||t==='today'||t==='admin') ? 'none' : '';
  renderAll();
}

// ── DATE ──────────────────────────────────────────────
function todayStr(){ return new Date().toISOString().slice(0,10); }
function fmtDate(s){ if(!s) return ''; const d=new Date(s+'T00:00'); return d.toLocaleDateString('en-AU',{day:'numeric',month:'short'}); }
function isToday(s){ return s===todayStr(); }
function isPast(s){ return s && s<todayStr(); }
function isSoon(s){ if(!s) return false; const diff=(new Date(s+'T00:00')-new Date())/86400000; return diff>=0&&diff<=2; }

// ── ALL TASKS flat ────────────────────────────────────
function allTasks(){ return ['work','errands','projects','fun'].flatMap(tl=>(S.tasks[tl]||[]).map(t=>({...t,_tab:tl}))); }

// ── TODAY TASKS ───────────────────────────────────────
function todayTasks(){
  const today = todayStr();
  // tasks due today, overdue, or daily recurring
  return allTasks().filter(t => {
    if (t.done && t.recurring!=='Daily') return false;
    if (t.recurring==='Daily') return true;
    if (t.due && t.due<=today) return true;
    return false;
  });
}

// ── RECURRING: generate due date ─────────────────────
function processDue(tasks){
  const today = todayStr();
  tasks.forEach(t => {
    if(t.recurring==='Daily' && t.done){
      // reset daily tasks each day
      if(t.lastDone !== today){ t.done=false; }
    }
    if(t.recurring==='Weekly' && t.done && t.lastDone){
      const d = new Date(t.lastDone); d.setDate(d.getDate()+7);
      if(new Date()>=d){ t.done=false; t.due=d.toISOString().slice(0,10); }
    }
    if(t.recurring==='Monthly' && t.done && t.lastDone){
      const d = new Date(t.lastDone); d.setMonth(d.getMonth()+1);
      if(new Date()>=d){ t.done=false; t.due=d.toISOString().slice(0,10); }
    }
  });
}

// ── RENDER ALL ────────────────────────────────────────
function renderAll(){
  // process recurring
  ['work','errands','projects','fun'].forEach(tl=>processDue(S.tasks[tl]||[]));

  // header
  const pending = allTasks().filter(t=>!t.done).length;
  const grInCart = grocInCartCount();
  const adminPending = ['errands','projects'].reduce((a,id)=>a+(S.tasks[id]||[]).filter(x=>!x.done).length,0);
  const now = new Date();
  const dayEl = document.getElementById('hdr-day');
  const stEl  = document.getElementById('hdr-status');
  if(dayEl) dayEl.textContent = now.toLocaleDateString('en-AU',{weekday:'long',day:'numeric',month:'long'});
  let statusHtml = '';
  if(tab==='today'){
    const n=todayTasks().filter(t=>!t.done).length;
    statusHtml = n>0 ? `<b>${n}</b> task${n!==1?'s':''} today` : `All clear today ✦`;
  } else if(tab==='grocery'){
    statusHtml = grInCart>0 ? `<b>${grInCart}</b> item${grInCart!==1?'s':''} in cart` : `Nothing in cart`;
  } else if(tab==='admin'){
    statusHtml = adminPending>0 ? `<b>${adminPending}</b> to take care of` : `Life admin clear ✦`;
  } else {
    const n=(S.tasks[tab]||[]).filter(t=>!t.done).length;
    statusHtml = n>0 ? `<b>${n}</b> task${n!==1?'s':''} pending` : `All done ✦`;
  }
  if(stEl) stEl.innerHTML = statusHtml;
  const logo = document.getElementById('hdr-logo');
  if(logo){ const cfg=TABS[tab]||TABS.today; logo.style.background=`linear-gradient(145deg,${cfg.acL},${cfg.ac})`; }

  // nav dots
  Object.keys(TABS).forEach(t=>{
    const dot = document.getElementById('nd-'+t);
    if(!dot) return;
    if(t==='today')   dot.classList.toggle('show', todayTasks().filter(x=>!x.done).length>0);
    else if(t==='grocery') dot.classList.toggle('show', grInCart>0);
    else if(t==='admin') {
      const adminPending = ['errands','projects'].reduce((a,id)=>a+(S.tasks[id]||[]).filter(x=>!x.done).length,0);
      dot.classList.toggle('show', adminPending>0);
    }
    else dot.classList.toggle('show', (S.tasks[t]||[]).filter(x=>!x.done).length>0);
  });

  if(searchQ) { renderSearch(); return; }
  if(tab==='today')   renderToday();
  else if(tab==='grocery') renderGrocery();
  else if(tab==='admin')   renderAdmin();
  else renderList(tab);
}

// ── RENDER ADMIN ──────────────────────────────────────
function renderAdmin(){
  const scroll = document.getElementById('scroll');
  let html = '';

  ADMIN_SECTIONS.forEach(sec => {
    const list = S.tasks[sec.id]||[];
    const pending = list.filter(t=>!t.done);
    const done    = list.filter(t=>t.done);
    const open    = doneOpen[sec.id]||false;

    html += `<div class="admin-section">
      <div class="admin-sec-hdr">
        <span class="admin-sec-icon">${sec.icon}</span>
        <span class="admin-sec-title">${sec.label}</span>
        ${pending.length>0?`<span class="admin-sec-count">${pending.length}</span>`:''}
      </div>`;

    if(list.length===0){
      html += `<div class="admin-empty">Nothing here — tap + to add</div>`;
    } else {
      html += pending.map(t=>taskHtml({...t,_tab:sec.id})).join('');
      if(done.length){
        html += `<div class="done-sec"><button class="done-hdr" onclick="toggleDone('${sec.id}')">
          <span class="done-arrow${open?' open':''}">›</span>
          <span class="done-lbl">Done</span>
          <span class="done-count">${done.length}</span>
          <button class="done-clear" onclick="clearDone('${sec.id}');event.stopPropagation()">Clear</button>
        </button><div class="done-list${open?' open':''}">${done.map(t=>taskHtml({...t,_tab:sec.id})).join('')}</div></div>`;
      }
    }

    // Per-section add bar
    html += `<div class="admin-add-row">
      <input class="admin-add-inp" id="ai-${sec.id}" placeholder="Add to ${sec.label}…" onkeydown="if(event.key==='Enter')addAdminTask('${sec.id}')"/>
      <div class="admin-add-pris">
        <button class="apb on-high" id="aapb-high-${sec.id}" onclick="setAdminPri('${sec.id}','high')">!</button>
        <button class="apb" id="aapb-med-${sec.id}"  onclick="setAdminPri('${sec.id}','med')">–</button>
        <button class="apb" id="aapb-low-${sec.id}"  onclick="setAdminPri('${sec.id}','low')">·</button>
      </div>
      <button class="admin-add-btn" onclick="addAdminTask('${sec.id}')">+</button>
    </div>`;

    html += `</div>`;
  });

  scroll.innerHTML = html;
  attachSwipe();
  ADMIN_SECTIONS.forEach(sec=>attachDrag(sec.id));
}

// per-section priority state
const adminPris = {errands:'high', projects:'high'};
function setAdminPri(secId, p){
  adminPris[secId]=p;
  ['high','med','low'].forEach(x=>{
    const b=document.getElementById(`aapb-${x}-${secId}`);
    if(b) b.className='apb'+(adminPris[secId]===x?` on-${x}`:'');
  });
}
function addAdminTask(secId){
  const inp=document.getElementById('ai-'+secId);
  const title=inp?.value.trim(); if(!title) return;
  if(!S.tasks[secId]) S.tasks[secId]=[];
  S.tasks[secId].unshift({
    id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),
    title, note:'', priority:adminPris[secId]||'high', done:false, due:'', recurring:'None', createdAt:Date.now()
  });
  inp.value=''; save(); renderAdmin();
}

// ── RENDER TODAY ──────────────────────────────────────
function renderToday(){
  const tasks = todayTasks();
  const scroll = document.getElementById('scroll');
  if(!tasks.length){
    scroll.innerHTML = `<div class="empty"><div class="empty-em">☀️</div><div class="empty-t">All clear today</div><div class="empty-s">Nothing due — enjoy your day!</div></div>`;
    return;
  }
  const pending = tasks.filter(t=>!t.done);
  const done    = tasks.filter(t=>t.done);
  let html = '';
  if(pending.length) html += pending.map(t=>taskHtml(t,true)).join('');
  if(done.length){
    const open = doneOpen['today']||false;
    html += `<div class="done-sec"><button class="done-hdr" onclick="toggleDone('today')">
      <span class="done-arrow${open?' open':''}">›</span>
      <span class="done-lbl">Done</span>
      <span class="done-count">${done.length}</span>
    </button><div class="done-list${open?' open':''}">${done.map(t=>taskHtml(t,true)).join('')}</div></div>`;
  }
  scroll.innerHTML = html;
  attachSwipe();
}

// ── RENDER LIST ───────────────────────────────────────
function renderList(tl){
  const list = S.tasks[tl]||[];
  const scroll = document.getElementById('scroll');
  if(!list.length){
    const cfg = TABS[tl];
    scroll.innerHTML = `<div class="empty"><div class="empty-em">${cfg.icon}</div><div class="empty-t">Nothing here yet</div><div class="empty-s">Tap + to add your first task</div></div>`;
    return;
  }
  const pending = list.filter(t=>!t.done);
  const done    = list.filter(t=>t.done);
  const open    = doneOpen[tl]||false;
  let html = pending.map(t=>taskHtml(t)).join('');
  if(done.length){
    html += `<div class="done-sec"><button class="done-hdr" onclick="toggleDone('${tl}')">
      <span class="done-arrow${open?' open':''}">›</span>
      <span class="done-lbl">Done</span>
      <span class="done-count">${done.length}</span>
      <button class="done-clear" onclick="clearDone('${tl}');event.stopPropagation()">Clear</button>
    </button><div class="done-list${open?' open':''}">${done.map(t=>taskHtml(t)).join('')}</div></div>`;
  }
  scroll.innerHTML = html;
  attachSwipe();
  attachDrag(tl);
}

function taskHtml(t, showList=false){
  const due    = t.due ? fmtDate(t.due) : '';
  const dueCls = isPast(t.due)&&!t.done?'due-late':isToday(t.due)&&!t.done?'due-today':isSoon(t.due)&&!t.done?'due-soon':'';
  const recHtml = t.recurring&&t.recurring!=='None' ? `<span class="rec-badge">↻ ${t.recurring}</span>` : '';
  const dueHtml = due ? `<span class="due-badge ${dueCls}">${due}</span>` : '';
  const listBadge = showList ? `<span style="font-size:10px;font-weight:700;background:rgba(0,0,0,.07);color:var(--ink3);border-radius:7px;padding:2px 8px">${TABS[t._tab||tab]?.icon||''} ${TABS[t._tab||tab]?.label||''}</span>` : '';
  return `<div class="task-wrap" id="tw-${t.id}">
    <div class="swipe-hint swipe-done" id="sd-${t.id}"><span class="swipe-icon">✓</span></div>
    <div class="swipe-hint swipe-del"  id="sx-${t.id}"><span class="swipe-icon">🗑</span></div>
    <div class="task p-${t.priority}${t.done?' done':''}" id="t-${t.id}" data-id="${t.id}" data-tab="${t._tab||tab}">
      <div class="task-body">
        <div class="t-check" onclick="toggleTask('${t.id}','${t._tab||tab}')">
          <svg class="t-tick" width="12" height="9" viewBox="0 0 12 9" fill="none"><path d="M1 4.5l3.5 3.5L10 1" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div class="t-dot"></div>
        <div class="t-info" onclick="openEdit('${t.id}','${t._tab||tab}')">
          <div class="t-title">${t.title}</div>
          ${t.note?`<div class="t-note">${t.note}</div>`:''}
          <div class="t-meta">${listBadge}<span class="pri-badge">${t.priority==='high'?'High':t.priority==='med'?'Med':'Low'}</span>${dueHtml}${recHtml}</div>
        </div>
        <span class="t-drag" data-id="${t.id}">⠿</span>
      </div>
    </div>
  </div>`;
}

// ── RENDER GROCERY ────────────────────────────────────
function renderGrocery(){
  const scroll = document.getElementById('scroll');
  const inCart = grocInCartCount();
  let html = '';
  if(inCart>0){
    html += `<div class="cart-summary">
      <div><div class="cart-txt">In your cart</div><div class="cart-sub">Tap items to remove</div></div>
      <div class="cart-count">${inCart}</div>
    </div>`;
  }
  html += '<div class="groc-wrap">';
  GROC_SECTIONS.forEach(sec=>{
    html += `<div class="groc-section"><div class="groc-sec-title">${sec.name}</div><div class="groc-grid">`;
    sec.items.forEach(item=>{
      html += grocItemHtml(item);
    });
    html += '</div></div>';
  });
  // custom items
  if(S.customGrocery&&S.customGrocery.length){
    html += `<div class="groc-section"><div class="groc-sec-title">Added by you</div><div class="groc-grid">`;
    S.customGrocery.forEach(item=>{ html += grocItemHtml(item); });
    html += '</div></div>';
  }
  html += `<div class="groc-section">
    <div class="groc-add-row">
      <input class="groc-add-inp" id="groc-add-inp" placeholder="Add custom item…" onkeydown="if(event.key==='Enter')addCustomGroc()"/>
      <button class="groc-add-btn" onclick="addCustomGroc()">Add</button>
    </div>
  </div>`;
  if(inCart>0){
    html += `<button class="groc-clear" onclick="clearCart()">🗑 Clear cart</button>`;
  }
  html += '</div>';
  scroll.innerHTML = html;
}

function grocItemHtml(item){
  const qty = S.grocery[item.id]||0;
  const inCart = qty>0;
  const defaultQty = item.defaultQty||1;
  return `<div class="groc-item${inCart?' in-cart':''}" id="gi-${item.id}">
    <div class="gi-emoji">${item.emoji}</div>
    <div class="gi-info" onclick="grocToggle('${item.id}',${defaultQty})">
      <div class="gi-name">${item.name}</div>
      ${item.defaultQty?`<div class="gi-sub">Usually ${item.defaultQty}</div>`:''}
    </div>
    <div class="gi-qty">
      <button class="qty-btn" onclick="grocAdj('${item.id}',-1)">−</button>
      <div class="qty-num${qty===0?' zero':''}" id="qn-${item.id}">${qty===0?'·':qty}</div>
      <button class="qty-btn qty-plus" onclick="grocAdj('${item.id}',1)">+</button>
    </div>
  </div>`;
}

function grocToggle(id, defaultQty){
  S.grocery[id] = S.grocery[id]>0 ? 0 : defaultQty;
  save(); renderGrocery();
}

function grocAdj(id, delta){
  const cur = S.grocery[id]||0;
  const next = Math.max(0, cur+delta);
  S.grocery[id] = next;
  // animate qty number
  const el = document.getElementById('qn-'+id);
  if(el){
    el.textContent = next===0?'·':next;
    el.className   = 'qty-num'+(next===0?' zero':'');
    if(delta>0){ el.classList.add('highlight'); setTimeout(()=>el.classList.remove('highlight'),300); }
    // update parent
    const parent = el.closest('.groc-item');
    if(parent) parent.classList.toggle('in-cart', next>0);
    const nameEl = parent?.querySelector('.gi-name');
    if(nameEl){ if(next>0) nameEl.style.textDecoration='line-through'; else nameEl.style.textDecoration=''; }
  }
  save();
  // update cart summary count lazily
  const sumEl = document.querySelector('.cart-count');
  if(sumEl) sumEl.textContent = grocInCartCount();
  // update header
  document.getElementById('hdr-sub').innerHTML = `<b>${grocInCartCount()}</b> item${grocInCartCount()!==1?'s':''} in your cart`;
}

function grocInCartCount(){ return Object.values(S.grocery||{}).reduce((a,v)=>a+(v>0?1:0),0); }

function addCustomGroc(){
  const inp = document.getElementById('groc-add-inp');
  const name = inp?.value.trim(); if(!name) return;
  if(!S.customGrocery) S.customGrocery=[];
  const id = 'gc-'+Date.now().toString(36);
  S.customGrocery.push({id,name,emoji:'🛒'});
  S.grocery[id]=0;
  inp.value=''; save(); renderGrocery();
}

function clearCart(){
  Object.keys(S.grocery).forEach(k=>S.grocery[k]=0);
  save(); renderGrocery();
}

// ── SEARCH ────────────────────────────────────────────
function toggleSearch(){
  const wrap = document.getElementById('search-wrap');
  const btn  = document.getElementById('search-btn');
  const open = wrap.classList.toggle('open');
  btn.classList.toggle('active', open);
  if(open){ setTimeout(()=>document.getElementById('search-inp').focus(),200); }
  else { searchQ=''; document.getElementById('search-inp').value=''; renderAll(); }
}
function onSearch(){
  searchQ = document.getElementById('search-inp').value.trim().toLowerCase();
  renderAll();
}
function renderSearch(){
  const results = allTasks().filter(t=>t.title.toLowerCase().includes(searchQ)||(t.note||'').toLowerCase().includes(searchQ));
  const scroll = document.getElementById('scroll');
  if(!results.length){ scroll.innerHTML=`<div class="empty"><div class="empty-em">🔍</div><div class="empty-t">No results</div><div class="empty-s">Try a different search</div></div>`; return; }
  scroll.innerHTML = results.map(t=>taskHtml(t,true)).join('');
  attachSwipe();
}

// ── TASK ACTIONS ──────────────────────────────────────
function toggleTask(id, tl){
  const list = S.tasks[tl]||[];
  const t = list.find(x=>x.id===id); if(!t) return;
  t.done = !t.done;
  if(t.done){ t.lastDone=todayStr(); if(t.recurring!=='None') confetti(); }
  save();
  const el = document.getElementById('t-'+id);
  if(el){ el.classList.toggle('done',t.done); el.classList.add('done-anim'); setTimeout(()=>el.classList.remove('done-anim'),400); }
  setTimeout(renderAll,50);
  if(t.done && allDoneToday()) { setTimeout(()=>toast('All done today! 🎉'),300); confetti(); }
}

function allDoneToday(){ return todayTasks().every(t=>t.done); }

function addTask(){
  const inp = document.getElementById('add-inp');
  const title = inp.value.trim(); if(!title) return;
  if(!S.tasks[tab]) S.tasks[tab]=[];
  S.tasks[tab].unshift({
    id: Date.now().toString(36)+Math.random().toString(36).slice(2,5),
    title, note:'', priority:addPri, done:false, due:'', recurring:'None', createdAt:Date.now()
  });
  inp.value=''; save(); renderAll(); inp.focus();
}

function setPri(p){
  addPri=p;
  ['high','med','low'].forEach(x=>{
    const b=document.getElementById('apb-'+x); if(!b)return;
    b.className='apb'+(addPri===x?` on-${x}`:'');
  });
}

function toggleDone(tl){ doneOpen[tl]=!doneOpen[tl]; save(); renderAll(); }
function clearDone(tl){ S.tasks[tl]=(S.tasks[tl]||[]).filter(t=>!t.done); save(); renderAll(); }

// ── EDIT SHEET ────────────────────────────────────────
function openEdit(id, tl){
  editId=id; editTab=tl||tab;
  const t=(S.tasks[editTab]||[]).find(x=>x.id===id); if(!t) return;
  document.getElementById('et-title').value = t.title;
  document.getElementById('et-note').value  = t.note||'';
  document.getElementById('et-due').value   = t.due||'';
  editPri = t.priority; editRec = t.recurring||'None';
  setEPri(editPri);
  // rec opts
  document.getElementById('rec-row').innerHTML = REC_OPTS.map(r=>
    `<button class="rec-opt${editRec===r?' sel':''}" onclick="setERec('${r}')">${r}</button>`
  ).join('');
  openSheet('sh-edit');
  setTimeout(()=>document.getElementById('et-title').focus(),350);
}

function setEPri(p){ editPri=p; ['high','med','low'].forEach(x=>{ const b=document.getElementById('ep-'+x); if(b) b.className='pri-opt'+(editPri===x?` s-${x}`:''); }); }
function setERec(r){ editRec=r; document.getElementById('rec-row').innerHTML=REC_OPTS.map(o=>`<button class="rec-opt${editRec===o?' sel':''}" onclick="setERec('${o}')">${o}</button>`).join(''); }

function saveEdit(){
  const t=(S.tasks[editTab]||[]).find(x=>x.id===editId); if(!t) return;
  t.title    = document.getElementById('et-title').value.trim()||t.title;
  t.note     = document.getElementById('et-note').value.trim();
  t.due      = document.getElementById('et-due').value;
  t.priority = editPri;
  t.recurring= editRec;
  save(); closeSheet('sh-edit'); renderAll();
}

function delTask(){
  S.tasks[editTab]=(S.tasks[editTab]||[]).filter(x=>x.id!==editId);
  save(); closeSheet('sh-edit'); renderAll();
}

// ── SWIPE TO COMPLETE / DELETE ────────────────────────
function attachSwipe(){
  document.querySelectorAll('.task').forEach(el=>{
    let sx=0,dx=0,active=false;
    el.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;dx=0;active=true;},{passive:true});
    el.addEventListener('touchmove',e=>{
      if(!active)return;
      dx=e.touches[0].clientX-sx;
      const clamped=Math.max(-100,Math.min(100,dx));
      el.style.transform=`translateX(${clamped}px)`;
      const id=el.dataset.id;
      const sdEl=document.getElementById('sd-'+id);
      const sxEl=document.getElementById('sx-'+id);
      if(sdEl) sdEl.style.opacity = dx>20?Math.min(1,(dx-20)/60):'0';
      if(sxEl) sxEl.style.opacity = dx<-20?Math.min(1,(-dx-20)/60):'0';
    },{passive:true});
    el.addEventListener('touchend',()=>{
      active=false;
      const id=el.dataset.id,tl=el.dataset.tab;
      if(dx>70){ toggleTask(id,tl); }
      else if(dx<-70){ deleteSwipe(id,tl); }
      else{
        el.style.transition='transform .25s cubic-bezier(.4,0,.2,1)';
        el.style.transform=''; setTimeout(()=>el.style.transition='',300);
      }
      const sdEl=document.getElementById('sd-'+id); if(sdEl)sdEl.style.opacity='0';
      const sxEl=document.getElementById('sx-'+id); if(sxEl)sxEl.style.opacity='0';
    });
  });
}

function deleteSwipe(id,tl){
  const el=document.getElementById('t-'+id);
  if(el){ el.style.transition='transform .25s,opacity .25s'; el.style.transform='translateX(110%)'; el.style.opacity='0'; }
  setTimeout(()=>{ S.tasks[tl]=(S.tasks[tl]||[]).filter(x=>x.id!==id); save(); renderAll(); },240);
}

// ── DRAG TO REORDER ───────────────────────────────────
function attachDrag(tl){
  let dragId=null,dragEl=null,startY=0,cloneEl=null,insertBefore=null;
  document.querySelectorAll('.t-drag').forEach(handle=>{
    handle.addEventListener('touchstart',e=>{
      e.stopPropagation();
      dragId=handle.dataset.id;
      dragEl=document.getElementById('t-'+dragId);
      startY=e.touches[0].clientY;
      dragEl.classList.add('dragging');
      cloneEl=dragEl.cloneNode(true);
      cloneEl.style.cssText=`position:fixed;left:20px;right:20px;z-index:100;pointer-events:none;opacity:.97;box-shadow:0 14px 40px rgba(0,0,0,.2);border-radius:18px;transition:none`;
      cloneEl.style.top=dragEl.getBoundingClientRect().top+'px';
      document.body.appendChild(cloneEl);
      dragEl.style.opacity='.3';
    },{passive:true});
    handle.addEventListener('touchmove',e=>{
      if(!dragId)return;
      const dy=e.touches[0].clientY-startY;
      cloneEl.style.top=(dragEl.getBoundingClientRect().top+dy)+'px';
      // find insertion point
      const wraps=Array.from(document.querySelectorAll('.task-wrap:not(.done)'));
      insertBefore=null;
      for(const w of wraps){
        const r=w.getBoundingClientRect();
        if(e.touches[0].clientY<r.top+r.height/2){ insertBefore=w.id.replace('tw-',''); break; }
      }
    },{passive:true});
    handle.addEventListener('touchend',()=>{
      if(!dragId)return;
      dragEl.style.opacity='';
      dragEl.classList.remove('dragging');
      if(cloneEl)cloneEl.remove();
      // reorder
      if(insertBefore && insertBefore!==dragId){
        const list=S.tasks[tl]||[];
        const fromIdx=list.findIndex(x=>x.id===dragId);
        const toIdx=list.findIndex(x=>x.id===insertBefore);
        if(fromIdx>-1&&toIdx>-1){ const [item]=list.splice(fromIdx,1); list.splice(toIdx,0,item); save(); }
      }
      dragId=null; dragEl=null; cloneEl=null; insertBefore=null;
      renderAll();
    });
  });
}

// ── CONFETTI ──────────────────────────────────────────
function confetti(){
  const cols=['#e05a2b','#3a6ea8','#2a9060','#7a50c0','#d4880a','#c0507a'];
  for(let i=0;i<48;i++){
    const el=document.createElement('div');el.className='cf';
    const sz=Math.random()*8+4;
    el.style.cssText=`left:${Math.random()*100}%;width:${sz}px;height:${sz*1.4}px;background:${cols[i%6]};border-radius:${Math.random()>.5?'50%':'2px'};animation-duration:${.7+Math.random()*.9}s;animation-delay:${Math.random()*.5}s`;
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),2000);
  }
}

// ── TOAST ─────────────────────────────────────────────
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),2400);
}

// ── SHEET ─────────────────────────────────────────────
function openSheet(id){ document.getElementById(id).classList.add('open'); document.body.style.overflow='hidden'; }
function closeSheet(id){ document.getElementById(id).classList.remove('open'); document.body.style.overflow=''; }
function maybeClose(e,id){ if(e.target===document.getElementById(id)) closeSheet(id); }

// ── INIT ──────────────────────────────────────────────
load();
go('today');
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Ritual</title>
<link rel="icon" href="icon.png"/>
<link rel="apple-touch-icon" href="icon.png"/>
<meta name="theme-color" content="#f8f4ef"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="Ritual"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap');

:root {
  --bg: #f8f4ef;
  --card: #ffffff;
  --card2: #fdf9f5;
  --terra: #c4714a;
  --terra-l: #d4836a;
  --terra-ll: #f0ddd5;
  --terra-pale: #fdf5f0;
  --rose: #d4836a;
  --ink: #1c1510;
  --ink2: #5a4a3a;
  --ink3: #9a8a7a;
  --ink4: #c4b4a4;
  --line: rgba(196,113,74,.12);
  --sh: rgba(100,60,30,.07);
  --sh2: rgba(100,60,30,.04);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{
  font-family:'DM Sans',-apple-system,sans-serif;
  background:var(--bg);color:var(--ink);
  -webkit-font-smoothing:antialiased;min-height:100vh;
  overscroll-behavior:none;
}
button,input,textarea,select{font-family:'DM Sans',-apple-system,sans-serif}
.serif{font-family:'Cormorant Garamond',Georgia,serif}

/* ─── screens ─────────────────────────────────────────── */
.page{display:none;max-width:430px;margin:0 auto;padding:0 20px 100px;min-height:100vh}
.page.active{display:block}

/* onboarding removed */

/* ─── inputs ──────────────────────────────────────────── */
.inp{
  width:100%;background:linear-gradient(135deg,#fdf9f4,#faf5ee);
  border:1.5px solid rgba(196,113,74,.2);border-radius:14px;
  padding:14px 16px;font-size:16px;color:var(--ink);
  outline:none;transition:all .2s;
  box-shadow:inset 0 1px 3px rgba(100,60,30,.04)
}
.inp:focus{border-color:var(--terra);box-shadow:0 0 0 4px rgba(196,113,74,.1),inset 0 1px 3px rgba(100,60,30,.04)}
.inp::placeholder{color:var(--ink4)}
textarea.inp{resize:none;line-height:1.6}
.inp-label{font-size:10px;font-weight:700;color:var(--terra);letter-spacing:.15em;text-transform:uppercase;margin-bottom:7px}
.inp-wrap{margin-bottom:18px}
.inp-row{display:flex;gap:10px}
.inp-row .inp-wrap{flex:1}

/* ─── buttons ─────────────────────────────────────────── */
.btn{
  width:100%;padding:16px;border-radius:14px;border:none;
  font-size:16px;font-weight:700;cursor:pointer;transition:all .2s
}
.btn-p{background:linear-gradient(145deg,#d4836a,#c4714a,#b0613c);color:#fff;box-shadow:0 4px 18px rgba(196,113,74,.35)}
.btn-p:hover{transform:translateY(-1px);box-shadow:0 7px 24px rgba(196,113,74,.4)}
.btn-p:disabled{background:linear-gradient(145deg,#d4c4b4,#c4b4a4);box-shadow:none;cursor:default;transform:none}
.btn-g{background:rgba(196,113,74,.09);color:var(--ink3);border:1.5px solid rgba(196,113,74,.15)}
.btn-g:hover{background:rgba(196,113,74,.16)}
.btn-sm{padding:11px 22px;width:auto;border-radius:12px;border:none;font-size:14px;font-weight:700;cursor:pointer;transition:all .2s}
.btn-sm-p{background:linear-gradient(145deg,#d4836a,#c4714a);color:#fff;box-shadow:0 3px 12px rgba(196,113,74,.28)}
.btn-sm-p:hover{transform:translateY(-1px)}
.btn-sm-g{background:rgba(196,113,74,.09);color:var(--ink3);border:1.5px solid rgba(196,113,74,.15)}
.btn-row{display:flex;gap:10px;margin-top:4px}

/* ─── emoji picker ────────────────────────────────────── */
.emoji-grid{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0 20px}
.em-btn{
  width:44px;height:44px;border-radius:12px;border:2px solid transparent;
  background:linear-gradient(135deg,#fdf9f4,#f9f3eb);
  font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .2s;box-shadow:0 1px 3px var(--sh2)
}
.em-btn.sel{border-color:var(--terra);background:var(--terra-pale);box-shadow:0 2px 8px rgba(196,113,74,.2)}
.em-btn:hover{transform:scale(1.12)}

/* ─── template picker ─────────────────────────────────── */
.tmpl-list{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
.tmpl-row{
  display:flex;align-items:center;gap:14px;
  padding:14px 16px;background:linear-gradient(135deg,#fdf9f4,#f9f3eb);
  border-radius:16px;cursor:pointer;border:2px solid transparent;
  transition:all .2s;box-shadow:0 1px 4px var(--sh2)
}
.tmpl-row:hover{border-color:rgba(196,113,74,.25);transform:translateY(-1px);box-shadow:0 4px 14px var(--sh)}
.tmpl-row.sel{border-color:var(--terra);background:var(--terra-pale)}
.tmpl-icon{font-size:24px;flex-shrink:0}
.tmpl-info{flex:1}
.tmpl-name{font-size:15px;font-weight:700;color:var(--ink)}
.tmpl-desc{font-size:12px;color:var(--ink3);margin-top:2px}
.tmpl-check{width:22px;height:22px;border-radius:50%;border:2px solid rgba(196,113,74,.25);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .2s}
.tmpl-row.sel .tmpl-check{background:var(--terra);border-color:var(--terra)}

/* ─── topbar ──────────────────────────────────────────── */
#topbar{
  display:flex;align-items:flex-start;justify-content:space-between;
  padding:28px 0 18px;position:sticky;top:0;
  background:linear-gradient(var(--bg) 88%,transparent);z-index:20
}
.tb-left .tb-name{
  font-family:'Cormorant Garamond',Georgia,serif;
  font-size:32px;font-weight:400;font-style:italic;color:var(--ink);line-height:1
}
.tb-left .tb-sub{font-size:13px;color:var(--ink3);font-weight:500;margin-top:4px}
.tb-right{display:flex;gap:8px;align-items:center;padding-top:4px}
.icon-btn{
  width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.9);
  border:1px solid rgba(196,113,74,.14);box-shadow:0 2px 8px var(--sh);
  display:flex;align-items:center;justify-content:center;
  font-size:18px;cursor:pointer;transition:all .2s
}
.icon-btn:hover{background:#fff;box-shadow:0 4px 14px var(--sh)}
.pill-tabs{
  display:flex;gap:3px;background:rgba(255,255,255,.85);
  border-radius:22px;padding:4px;border:1px solid rgba(196,113,74,.12);
  box-shadow:0 2px 8px var(--sh)
}
.pill{
  padding:7px 15px;border-radius:18px;border:none;
  font-size:13px;font-weight:600;cursor:pointer;
  background:transparent;color:var(--ink3);transition:all .2s
}
.pill.active{background:linear-gradient(145deg,#d4836a,#c4714a);color:#fff;box-shadow:0 2px 8px rgba(196,113,74,.3)}

/* ─── week nav ────────────────────────────────────────── */
.wk-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.wk-arr{
  width:40px;height:40px;border-radius:13px;border:none;
  background:rgba(255,255,255,.85);color:var(--terra);font-size:18px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  border:1px solid rgba(196,113,74,.15);box-shadow:0 2px 8px var(--sh);transition:all .2s
}
.wk-arr:hover{background:#fff;transform:scale(1.05)}
.wk-arr:disabled{opacity:.25;cursor:default;transform:none}
.wk-mid{text-align:center}
.wk-range{
  font-family:'Cormorant Garamond',Georgia,serif;
  font-size:20px;font-weight:400;font-style:italic;color:var(--ink)
}
.wk-now{font-size:10px;font-weight:700;color:var(--ink4);letter-spacing:.1em;text-transform:uppercase;margin-top:3px}

/* ─── progress hero ───────────────────────────────────── */
.hero{
  background:linear-gradient(145deg,#c97a58,#b86845,#9e5535,#8c4428);
  border-radius:28px;padding:26px 24px 22px;margin-bottom:20px;
  position:relative;overflow:hidden;
  box-shadow:0 10px 36px rgba(140,68,40,.28),inset 0 1px 0 rgba(255,255,255,.15)
}
.hero::before{
  content:'';position:absolute;top:-50px;right:-30px;width:200px;height:200px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.1),transparent 65%);pointer-events:none
}
.hero-ey{font-size:10px;font-weight:700;color:rgba(255,255,255,.5);letter-spacing:.2em;text-transform:uppercase;margin-bottom:12px}
.hero-score{display:flex;align-items:flex-end;gap:6px;margin-bottom:6px}
.hero-n{
  font-family:'Cormorant Garamond',Georgia,serif;
  font-size:76px;font-weight:300;color:#fff;line-height:.9;
  text-shadow:0 2px 16px rgba(0,0,0,.18)
}
.hero-d{
  font-family:'Cormorant Garamond',Georgia,serif;
  font-size:32px;font-weight:300;color:rgba(255,255,255,.4);padding-bottom:10px
}
.hero-status{
  font-family:'Cormorant Garamond',Georgia,serif;
  font-size:18px;font-style:italic;color:rgba(255,255,255,.8);margin-bottom:20px
}
.hero-track{height:4px;background:rgba(255,255,255,.2);border-radius:4px;overflow:hidden}
.hero-fill{height:100%;background:rgba(255,255,255,.75);border-radius:4px;transition:width .7s cubic-bezier(.4,0,.2,1)}

/* ─── day strip ───────────────────────────────────────── */
.day-strip{display:flex;gap:6px;margin-bottom:24px}
.day-cell{
  flex:1;background:rgba(255,255,255,.8);border-radius:16px;
  padding:10px 3px 9px;display:flex;flex-direction:column;align-items:center;gap:5px;
  border:1.5px solid rgba(255,255,255,.95);box-shadow:0 2px 8px var(--sh);transition:all .2s
}
.day-cell.today{background:linear-gradient(145deg,#fdf0e8,#f8e4d4);border-color:rgba(196,113,74,.3);box-shadow:0 4px 16px rgba(196,113,74,.15)}
.day-l{font-size:10px;font-weight:700;color:var(--ink4);letter-spacing:.06em}
.day-cell.today .day-l{color:var(--terra)}
.day-n{font-family:'Cormorant Garamond',Georgia,serif;font-size:18px;font-weight:400;color:var(--ink);line-height:1}
.day-cell.today .day-n{color:var(--terra)}
.day-dot{width:5px;height:5px;border-radius:50%;background:linear-gradient(135deg,#d4836a,#c4714a);opacity:0;transition:opacity .3s}
.day-dot.on{opacity:1}

/* ─── section label ───────────────────────────────────── */
.sec-label{
  font-size:10px;font-weight:700;color:var(--ink4);letter-spacing:.16em;text-transform:uppercase;
  margin:4px 0 14px;display:flex;align-items:center;gap:10px
}
.sec-label::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(196,113,74,.15),transparent)}

/* ─── dashboard grid ──────────────────────────────────── */
.dash-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-bottom:28px
}
/* wide card spans both columns */
.dash-grid .hcard.wide{grid-column:1/-1}

/* ─── habit card ──────────────────────────────────────── */
.hcard{
  background:var(--card);border-radius:22px;
  border:1px solid rgba(196,113,74,.1);
  box-shadow:0 4px 18px var(--sh),0 1px 4px var(--sh2);
  cursor:pointer;transition:all .25s;
  display:flex;flex-direction:column;
  position:relative;overflow:hidden;
  min-height:130px;padding:18px 16px 14px
}
.hcard:hover{box-shadow:0 8px 30px rgba(100,60,30,.12);transform:translateY(-2px)}
.hcard:active{transform:translateY(0);box-shadow:0 3px 12px var(--sh)}
.hcard.done{background:linear-gradient(145deg,#fdf5ef,#f9ede2)}

/* done shimmer line */
.hcard.done::after{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--terra-l),var(--terra))
}

.hcard-emoji{font-size:30px;line-height:1;margin-bottom:10px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.1))}
.hcard-name{
  font-size:14px;font-weight:700;color:var(--ink);
  line-height:1.2;margin-bottom:4px;flex:1
}
.hcard.done .hcard-name{color:var(--ink3)}
.hcard-meta{font-size:11px;color:var(--ink4);font-weight:500;margin-bottom:10px}
.hcard-meta .streak{color:var(--terra);font-weight:700;background:rgba(196,113,74,.1);padding:1px 6px;border-radius:5px;font-size:10px}

/* check ring at bottom right */
.hcard-check{
  position:absolute;bottom:14px;right:14px;
  width:30px;height:30px;border-radius:50%;
  border:2px solid rgba(196,113,74,.25);background:transparent;
  display:flex;align-items:center;justify-content:center;transition:all .25s
}
.hcard.done .hcard-check{background:linear-gradient(145deg,#d4836a,#c4714a);border-color:transparent;box-shadow:0 3px 10px rgba(196,113,74,.38)}
.hcard-tick{opacity:0;transform:scale(0);transition:all .22s cubic-bezier(.34,1.56,.64,1)}
.hcard.done .hcard-tick{opacity:1;transform:scale(1)}

/* logged preview */
.hcard-preview{
  font-family:'Cormorant Garamond',Georgia,serif;
  font-size:13px;font-style:italic;color:var(--ink2);
  line-height:1.4;
  border-top:1px solid rgba(196,113,74,.08);
  padding-top:8px;margin-top:4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  max-width:calc(100% - 36px)
}

/* ─── add habit card ──────────────────────────────────── */
.add-card{
  background:rgba(255,255,255,.5);border-radius:22px;
  border:2px dashed rgba(196,113,74,.22);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:8px;cursor:pointer;min-height:130px;transition:all .2s
}
.add-card:hover{background:rgba(255,255,255,.8);border-color:rgba(196,113,74,.45)}
.add-card-icon{font-size:28px;color:rgba(196,113,74,.4)}
.add-card-label{font-size:13px;font-weight:600;color:var(--ink4)}

/* ─── nudge ───────────────────────────────────────────── */
.nudge{
  background:linear-gradient(135deg,#fdf5f0,#f9ede4);
  border:1.5px solid rgba(196,113,74,.2);border-radius:20px;
  padding:14px 18px;margin-bottom:18px;
  display:flex;align-items:center;justify-content:space-between;
  box-shadow:0 4px 14px rgba(196,113,74,.1)
}
.nudge-txt{font-family:'Cormorant Garamond',Georgia,serif;font-size:17px;font-style:italic;color:var(--terra)}
.nudge-sub{font-size:12px;color:var(--rose);margin-top:2px}
.nudge-badge{background:linear-gradient(145deg,#d4836a,#c4714a);border-radius:12px;padding:7px 13px;text-align:center;flex-shrink:0;box-shadow:0 3px 10px rgba(196,113,74,.3)}
.nudge-n{font-size:20px;font-weight:800;color:#fff;line-height:1}
.nudge-lbl{font-size:9px;font-weight:700;color:rgba(255,255,255,.8);letter-spacing:.06em;text-transform:uppercase}

/* ─── history ─────────────────────────────────────────── */
.stat-row{display:flex;gap:10px;margin-bottom:22px}
.stat-card{
  flex:1;background:var(--card);border-radius:20px;
  padding:16px 14px 14px;border:1px solid rgba(196,113,74,.1);
  box-shadow:0 4px 14px var(--sh)
}
.stat-v{font-family:'Cormorant Garamond',Georgia,serif;font-size:38px;font-weight:300;color:var(--ink);line-height:1}
.stat-l{font-size:10px;font-weight:700;color:var(--ink4);letter-spacing:.1em;text-transform:uppercase;margin-top:5px}
.hist-list{display:flex;flex-direction:column;gap:8px}
.hist-row{
  background:var(--card);border-radius:18px;padding:13px 16px;
  display:flex;align-items:center;gap:12px;
  border:1.5px solid rgba(196,113,74,.08);
  box-shadow:0 2px 8px var(--sh2);cursor:pointer;transition:all .2s
}
.hist-row:hover{transform:translateY(-1px);box-shadow:0 5px 16px var(--sh);border-color:rgba(196,113,74,.2)}
.hist-row.cur{border-color:rgba(196,113,74,.38);background:linear-gradient(135deg,#fdf5ef,#faf0e6)}
.hist-date{font-family:'Cormorant Garamond',Georgia,serif;font-size:14px;font-style:italic;color:var(--ink3);width:72px;flex-shrink:0}
.hist-pips{display:flex;gap:5px;flex:1;flex-wrap:wrap}
.hist-pip{width:28px;height:28px;border-radius:9px;background:rgba(196,113,74,.07);display:flex;align-items:center;justify-content:center;font-size:14px;transition:background .2s}
.hist-pip.done{background:rgba(196,113,74,.14)}
.hist-pip.perfect{background:linear-gradient(145deg,#d4836a,#c4714a);box-shadow:0 2px 6px rgba(196,113,74,.3)}
.hist-sc{font-family:'Cormorant Garamond',Georgia,serif;font-size:15px;font-weight:400;color:var(--ink4);width:28px;text-align:right}
.hist-sc.full{color:var(--terra)}

/* ─── overlays / sheets ───────────────────────────────── */
.overlay{
  position:fixed;inset:0;background:rgba(20,10,5,.42);
  backdrop-filter:blur(5px);z-index:100;
  display:flex;align-items:flex-end;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .25s
}
.overlay.open{opacity:1;pointer-events:all}
.sheet{
  background:var(--card);border-radius:30px 30px 0 0;
  width:100%;max-width:430px;padding:0 24px 52px;
  max-height:92vh;overflow-y:auto;
  transform:translateY(100%);
  box-shadow:0 -8px 40px rgba(100,60,30,.12);
  transition:transform .3s cubic-bezier(.32,0,.67,0)
}
.overlay.open .sheet{transform:translateY(0);transition:transform .38s cubic-bezier(.33,1,.68,1)}
.sheet.sheet-warm{background:linear-gradient(160deg,#fdf8f2,#f8f0e4)}
.sh-handle{width:44px;height:4px;background:linear-gradient(90deg,rgba(196,113,74,.3),rgba(196,113,74,.1));border-radius:3px;margin:16px auto 24px}
.sh-title{font-family:'Cormorant Garamond',Georgia,serif;font-size:26px;font-weight:400;font-style:italic;color:var(--ink);margin-bottom:4px}
.sh-sub{font-size:14px;color:var(--ink3);margin-bottom:24px;line-height:1.5}
.sh-head{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.sh-emoji{font-size:30px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.1))}

/* ─── field chips (multi-select) ──────────────────────── */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.chip{
  padding:9px 16px;border-radius:20px;border:1.5px solid rgba(196,113,74,.2);
  background:#fdf9f4;font-size:14px;font-weight:600;color:var(--ink3);
  cursor:pointer;transition:all .2s
}
.chip.sel{background:var(--terra-pale);border-color:var(--terra);color:var(--terra)}
.chip:hover:not(.sel){border-color:rgba(196,113,74,.35)}

/* ─── star rating ─────────────────────────────────────── */
.stars{display:flex;gap:4px;margin-bottom:4px}
.star{font-size:28px;cursor:pointer;color:rgba(196,113,74,.18);transition:all .15s;line-height:1}
.star.on{color:#d4943a;filter:drop-shadow(0 1px 3px rgba(212,148,58,.4))}
.star:hover{transform:scale(1.18)}

/* ─── toggle switch ───────────────────────────────────── */
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line)}
.toggle-row:last-child{border-bottom:none}
.toggle-label{font-size:15px;font-weight:600;color:var(--ink)}
.toggle-sub{font-size:12px;color:var(--ink3);margin-top:2px}
.toggle{position:relative;width:48px;height:28px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0}
.toggle-track{
  position:absolute;inset:0;border-radius:14px;
  background:#e0d8d0;transition:background .2s;cursor:pointer
}
.toggle input:checked + .toggle-track{background:linear-gradient(145deg,#d4836a,#c4714a)}
.toggle-knob{
  position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;
  background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.15);transition:transform .2s
}
.toggle input:checked ~ .toggle-knob{transform:translateX(20px)}

/* ─── spending card (full width) ─────────────────────── */
.spend-card{
  background:var(--card);border-radius:22px;
  border:1px solid rgba(196,113,74,.1);box-shadow:0 4px 18px var(--sh);
  overflow:hidden;cursor:pointer;transition:all .25s;margin-bottom:12px
}
.spend-card:hover{box-shadow:0 8px 30px rgba(100,60,30,.12);transform:translateY(-2px)}
.spend-card.done::after{content:'';display:block;height:3px;background:linear-gradient(90deg,var(--terra-l),var(--terra));margin-top:-3px}
.spend-top{padding:18px 20px 14px;display:flex;align-items:flex-start;gap:14px}
.spend-body{padding:0 20px 18px}
.spend-big{
  font-family:'Cormorant Garamond',Georgia,serif;
  font-size:40px;font-weight:300;line-height:1
}
.spend-big.ok{color:var(--terra)}
.spend-big.warn{color:#c48838}
.spend-big.over{color:#c04040}
.spend-of{font-family:'Cormorant Garamond',Georgia,serif;font-size:20px;color:var(--ink4);font-weight:300}
.spend-bar-bg{height:6px;background:rgba(196,113,74,.1);border-radius:6px;overflow:hidden;margin-bottom:8px}
.spend-bar{height:100%;border-radius:6px;transition:width .7s cubic-bezier(.4,0,.2,1)}
.spend-bar.ok{background:linear-gradient(90deg,#d4836a,#c4714a)}
.spend-bar.over{background:linear-gradient(90deg,#e07070,#c04040)}
.spend-st{font-size:13px;font-weight:700}
.spend-st.ok{color:var(--terra)}
.spend-st.over{color:#c04040}
.spend-st.warn{color:#c48838}
.spend-via{font-size:10px;font-weight:700;color:var(--ink4);background:rgba(196,113,74,.1);padding:3px 9px;border-radius:8px;letter-spacing:.08em;text-transform:uppercase;margin-left:auto;flex-shrink:0}
.spend-manual{display:flex;gap:8px;margin-top:12px}
.spend-manual input{flex:1;background:linear-gradient(135deg,#fdf9f4,#faf5ee);border:1.5px solid rgba(196,113,74,.2);border-radius:12px;padding:11px 14px;font-size:14px;color:var(--ink);outline:none;transition:all .2s}
.spend-manual input:focus{border-color:var(--terra);box-shadow:0 0 0 3px rgba(196,113,74,.1)}
.spend-manual button{background:linear-gradient(145deg,#d4836a,#c4714a);color:#fff;border:none;border-radius:12px;padding:11px 18px;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 2px 8px rgba(196,113,74,.28)}

/* ─── celebration ─────────────────────────────────────── */
.confetti-piece{position:fixed;top:-10px;border-radius:3px;pointer-events:none;z-index:300}
@keyframes cf-fall{0%{transform:translateY(0) rotate(0deg);opacity:1}85%{opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}
.toast{
  position:fixed;left:50%;bottom:110px;z-index:301;
  background:rgba(255,253,249,.97);backdrop-filter:blur(20px);
  border-radius:26px;padding:20px 30px;
  border:1px solid rgba(196,113,74,.15);
  box-shadow:0 16px 60px rgba(140,68,40,.18),0 4px 12px rgba(0,0,0,.06);
  text-align:center;pointer-events:none;white-space:nowrap;
  transform:translateX(-50%) scale(.8) translateY(20px);opacity:0;
  transition:all .45s cubic-bezier(.34,1.56,.64,1)
}
.toast.show{opacity:1;transform:translateX(-50%) scale(1) translateY(0)}
.toast-em{font-size:34px;margin-bottom:6px}
.toast-t{font-family:'Cormorant Garamond',Georgia,serif;font-size:21px;font-style:italic;color:var(--ink)}
.toast-s{font-size:13px;color:var(--ink3);margin-top:3px}

/* ─── reading nights ──────────────────────────────────── */
.night-grid{display:flex;gap:6px;margin-bottom:10px}
.night-btn{
  flex:1;height:36px;border-radius:10px;
  border:2px solid rgba(196,113,74,.15);background:rgba(255,255,255,.7);
  cursor:pointer;font-size:11px;font-weight:700;color:var(--ink4);transition:all .2s
}
.night-btn.on{border-color:transparent;background:linear-gradient(145deg,#d4836a,#c4714a);color:#fff;box-shadow:0 2px 8px rgba(196,113,74,.28)}

/* ─── delete btn ──────────────────────────────────────── */
.del-btn{
  width:100%;padding:14px;border-radius:14px;border:1.5px solid rgba(200,50,50,.2);
  background:rgba(200,50,50,.06);color:#c04040;font-size:15px;font-weight:700;cursor:pointer;
  margin-top:20px;transition:all .2s
}
.del-btn:hover{background:rgba(200,50,50,.12)}

/* ─── animations ──────────────────────────────────────── */
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.fade-up{animation:fadeUp .32s cubic-bezier(.33,1,.68,1) both}
</style>
</head>
<body>

<!-- ══ MAIN APP ════════════════════════════════════════ -->
<div id="pg-app" class="page active">
  <div id="topbar">
    <div class="tb-left">
      <div class="tb-name serif" id="tb-name">Hey, Sophie</div>
      <div class="tb-sub" id="tb-sub">3 days left</div>
    </div>
    <div class="tb-right">
      <div class="pill-tabs">
        <button class="pill active" onclick="switchTab('weekly')">Week</button>
        <button class="pill" onclick="switchTab('history')">History</button>
      </div>
      <button class="icon-btn" onclick="openSheet('sh-settings')" title="Settings">⚙️</button>
    </div>
  </div>

  <div class="wk-nav">
    <button class="wk-arr" id="wk-prev" onclick="changeWeek(-1)">←</button>
    <div class="wk-mid">
      <div class="wk-range" id="wk-range">May 19–25</div>
      <div class="wk-now" id="wk-now">THIS WEEK</div>
    </div>
    <button class="wk-arr" id="wk-next" onclick="changeWeek(1)">→</button>
  </div>

  <!-- Weekly screen -->
  <div id="sc-weekly">
    <div id="nudge-wrap"></div>
    <div class="hero">
      <div class="hero-ey">THIS WEEK</div>
      <div class="hero-score">
        <div class="hero-n serif" id="hero-n">0</div>
        <div class="hero-d serif" id="hero-d">/0</div>
      </div>
      <div class="hero-status serif" id="hero-status">Not started</div>
      <div class="hero-track"><div class="hero-fill" id="hero-fill" style="width:0%"></div></div>
    </div>
    <div class="day-strip" id="day-strip"></div>
    <div class="sec-label">Habits</div>
    <div class="dash-grid" id="dash-grid"></div>
    <div id="memory-wrap"></div>
  </div>

  <!-- History screen -->
  <div id="sc-history" style="display:none">
    <div class="stat-row" id="stat-row"></div>
    <div class="sec-label" style="margin-bottom:12px">Last 12 weeks</div>
    <div class="hist-list" id="hist-list"></div>
  </div>
</div>

<!-- ══ OVERLAYS ════════════════════════════════════════ -->

<!-- Log habit sheet -->
<div class="overlay" id="sh-log" onclick="maybeClose(event,'sh-log')">
  <div class="sheet">
    <div class="sh-handle"></div>
    <div id="sh-log-body"></div>
  </div>
</div>

<!-- Add / Edit habit sheet -->
<div class="overlay" id="sh-habit" onclick="maybeClose(event,'sh-habit')">
  <div class="sheet sheet-warm">
    <div class="sh-handle"></div>
    <div id="sh-habit-body"></div>
  </div>
</div>

<!-- Settings sheet -->
<div class="overlay" id="sh-settings" onclick="maybeClose(event,'sh-settings')">
  <div class="sheet">
    <div class="sh-handle"></div>
    <div class="sh-title">Settings</div>
    <div style="margin-top:20px">
      <div class="inp-wrap">
        <div class="inp-label">Your name</div>
        <input type="text" class="inp" id="set-name"/>
      </div>
      <div class="inp-wrap">
        <div class="inp-label">Weekly spending budget</div>
        <div style="display:flex;align-items:center;background:linear-gradient(135deg,#fdf9f4,#faf5ee);border:1.5px solid rgba(196,113,74,.2);border-radius:14px;overflow:hidden">
          <span style="padding:14px 6px 14px 16px;font-size:16px;color:var(--terra);font-weight:700">$</span>
          <input type="number" style="flex:1;background:transparent;border:none;padding:14px 16px 14px 4px;font-size:16px;color:var(--ink);outline:none" id="set-budget"/>
        </div>
      </div>
      <div class="inp-wrap">
        <div class="inp-label">Up Bank token <span style="color:var(--ink4);font-weight:400;text-transform:none;letter-spacing:0;font-size:12px">(optional)</span></div>
        <input type="password" class="inp" id="set-token" placeholder="up:yeah:••••••••"/>
        <div style="font-size:12px;color:var(--ink3);margin-top:6px;line-height:1.5">Up app → Settings → API → Create token</div>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn-sm btn-sm-g" onclick="closeSheet('sh-settings')">Cancel</button>
      <button class="btn-sm btn-sm-p" style="flex:1" onclick="saveSettings()">Save</button>
    </div>
  </div>
</div>

<!-- Confetti + Toast -->
<div id="confetti-wrap" style="position:fixed;inset:0;pointer-events:none;z-index:300;overflow:hidden"></div>
<div class="toast" id="toast">
  <div class="toast-em">🎉</div>
  <div class="toast-t" id="toast-t"></div>
  <div class="toast-s" id="toast-s"></div>
</div>

<script>
'use strict';

// ══════════════════════════════════════════════════════
// CONFIG
// ══════════════════════════════════════════════════════
const SK = 'ritual-v6';
const DAYS = ['M','T','W','T','F','S','S'];
const EMOJIS = ['💼','🍷','🍳','🤝','📚','💳','🏃','🧘','✈️','🎨','🎵','💪','🌿','📝','🎯','🌍','🍿','🧁','☕','🛁','🎭','🌅','💐','🥂'];

// Field templates
const TEMPLATES = [
  {id:'person-place', name:'Person + Place', desc:'Great for dates, catch-ups, events', icon:'🤝', fields:[
    {id:'who',   label:'Who',   type:'text', placeholder:'e.g. James, Sarah & Tom'},
    {id:'where', label:'Where', type:'text', placeholder:'e.g. Ester, Newtown'},
    {id:'note',  label:'Notes', type:'textarea', placeholder:'How was it?', optional:true},
  ]},
  {id:'person-topic', name:'Person + Topic', desc:'Career convos, mentoring, networking', icon:'💼', fields:[
    {id:'who',   label:'Who',   type:'text', placeholder:'e.g. Sarah Chen, Google'},
    {id:'topic', label:'Topic', type:'text', placeholder:'e.g. Product strategy, new role'},
    {id:'note',  label:'Key takeaway', type:'textarea', placeholder:'What did you learn?', optional:true},
  ]},
  {id:'make-rate', name:'Make + Rate', desc:'Recipes, crafts, creative projects', icon:'🍳', fields:[
    {id:'name',   label:'What',   type:'text', placeholder:'e.g. Mushroom risotto'},
    {id:'rating', label:'Rating', type:'stars'},
    {id:'note',   label:'Notes', type:'textarea', placeholder:'Would you make again?', optional:true},
  ]},
  {id:'book', name:'Book + Rating', desc:'Reading tracker', icon:'📚', fields:[
    {id:'book',   label:'Book',   type:'text', placeholder:'e.g. Atomic Habits'},
    {id:'author', label:'Author', type:'text', placeholder:'e.g. James Clear', optional:true},
    {id:'rating', label:'Rating', type:'stars'},
    {id:'note',   label:'Thoughts', type:'textarea', placeholder:'What did you think?', optional:true},
  ]},
  {id:'nights', name:'Night tracker', desc:'Track how many nights per week', icon:'🌙', fields:[], special:'nights', target:3},
  {id:'spending', name:'Spending goal', desc:'Track weekly spend vs budget', icon:'💳', fields:[], special:'spending'},
  {id:'simple', name:'Just done / not done', desc:'Simple weekly checkbox', icon:'✅', fields:[
    {id:'note', label:'Notes', type:'textarea', placeholder:'Any details…', optional:true},
  ]},
];

const DEFAULT_HABITS = [
  {id:'career',   label:'Career conversation', emoji:'💼', templateId:'person-topic',  done:{}, entries:{}, streakCache:0},
  {id:'date',     label:'Date',                emoji:'🍷', templateId:'person-place',  done:{}, entries:{}, streakCache:0},
  {id:'recipe',   label:'New recipe',          emoji:'🍳', templateId:'make-rate',      done:{}, entries:{}, streakCache:0},
  {id:'friends',  label:'Friends catch-up',    emoji:'🤝', templateId:'person-place',  done:{}, entries:{}, streakCache:0},
  {id:'reading',  label:'Reading',             emoji:'📚', templateId:'book',           done:{}, entries:{}, nights:{}, streakCache:0},
  {id:'spending', label:'Under spending goal', emoji:'💳', templateId:'spending',       done:{}, entries:{}, streakCache:0},
];

// ══════════════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════════════
let S = null; // { userName, habits, budget, upToken, celebrated }
let currentWeek = todayWeekKey();
let currentTab = 'weekly';
let loggingId = null;
let editingId = null; // null = new habit
let obStep = 0;
let obName = '';
let obBudget = '';
let obToken = '';
let upSpend = null;
let upLoading = false;
let upError = null;
let _starRating = 0;
let _nightsSel = [];

// ══════════════════════════════════════════════════════
// DATE HELPERS
// ══════════════════════════════════════════════════════
function todayWeekKey(d = new Date()) {
  const x = new Date(d); x.setHours(0,0,0,0);
  x.setDate(x.getDate() - ((x.getDay()+6)%7));
  return x.toISOString().slice(0,10);
}
function nextWeekKey() {
  const d = new Date(todayWeekKey()); d.setDate(d.getDate()+7);
  return d.toISOString().slice(0,10);
}
function offsetWeek(wk, n) {
  const d = new Date(wk); d.setDate(d.getDate()+n*7);
  return d.toISOString().slice(0,10);
}
function weekDates(wk) {
  return Array.from({length:7}, (_,i) => { const d=new Date(wk); d.setDate(d.getDate()+i); return d; });
}
function fmtRange(wk) {
  const [s,e] = [weekDates(wk)[0], weekDates(wk)[6]];
  const mo = d => d.toLocaleDateString('en-AU',{month:'short'});
  return s.getMonth()===e.getMonth() ? `${mo(s)} ${s.getDate()}–${e.getDate()}` : `${mo(s)} ${s.getDate()} – ${mo(e)} ${e.getDate()}`;
}
function daysLeft() {
  const now = new Date(); now.setHours(0,0,0,0);
  const end = new Date(todayWeekKey()); end.setDate(end.getDate()+6);
  return Math.max(0, Math.round((end-now)/86400000));
}

// ══════════════════════════════════════════════════════
// STORAGE
// ══════════════════════════════════════════════════════
function load() { try { return JSON.parse(localStorage.getItem(SK)) || null; } catch { return null; } }
function save() { try { localStorage.setItem(SK, JSON.stringify(S)); } catch {} }

// ══════════════════════════════════════════════════════
// HABIT LOGIC
// ══════════════════════════════════════════════════════
function tmpl(h) { return TEMPLATES.find(t=>t.id===h.templateId) || TEMPLATES[TEMPLATES.length-1]; }

function isHabitDone(h, wk) {
  wk = wk || currentWeek;
  const t = tmpl(h);
  if (t.special === 'nights') return (h.nights[wk] || []).length >= (t.target||3);
  return !!(h.done[wk]);
}

function totalDone(wk) {
  wk = wk || currentWeek;
  return S.habits.filter(h => isHabitDone(h, wk)).length;
}

function getStreak(h) {
  let s=0, wk=currentWeek;
  while (isHabitDone(h, wk)) { s++; wk=offsetWeek(wk,-1); if(s>52) break; }
  return s;
}

function previewText(h, wk) {
  wk = wk || currentWeek;
  const e = h.entries[wk] || {};
  if (e.who && e.where) return `${e.who} · ${e.where}`;
  if (e.who) return e.who;
  if (e.name) return e.name;
  if (e.book) return e.book;
  if (e.note) return e.note;
  const t = tmpl(h);
  if (t.special === 'nights') { const n = (h.nights[wk]||[]).length; return n > 0 ? `${n} nights` : ''; }
  if (t.special === 'spending') {
    const amt = upSpend !== null ? upSpend : (h.entries[wk]||{}).manualAmount;
    if (amt != null) return `$${Number(amt).toFixed(0)} / $${S.budget}`;
  }
  return '';
}

// ══════════════════════════════════════════════════════
// ONBOARDING
// ══════════════════════════════════════════════════════
function renderOb() {
  const box = document.getElementById('ob-box');
  if (obStep === 0) {
    box.innerHTML = `
      <div class="ob-logo">Ritual.</div>
      <div class="ob-tag">Your weekly life tracker — intentional living made simple.</div>
      <div class="ob-step-label">Getting started</div>
      <div class="ob-q">What should we call you?</div>
      <div class="inp-wrap">
        <input type="text" class="inp" id="ob-name-inp" placeholder="Your name" autocomplete="given-name"/>
      </div>
      <button class="btn btn-p" id="ob-btn1" disabled onclick="obNext()">Continue →</button>`;
    const inp = document.getElementById('ob-name-inp');
    inp.addEventListener('input', e => { obName=e.target.value.trim(); document.getElementById('ob-btn1').disabled=!obName; });
    inp.addEventListener('keydown', e => { if(e.key==='Enter'&&obName) obNext(); });
    inp.focus();
  } else if (obStep === 1) {
    box.innerHTML = `
      <div class="ob-step-label">Step 2 of 3</div>
      <div class="ob-q">Set your spending goal</div>
      <div class="ob-hint">We'll track your weekly spend automatically with Up Bank, or you can enter it manually.</div>
      <div class="inp-wrap">
        <div class="inp-label">Weekly budget</div>
        <div style="display:flex;align-items:center;background:linear-gradient(135deg,#fdf9f4,#faf5ee);border:1.5px solid rgba(196,113,74,.2);border-radius:14px;overflow:hidden">
          <span style="padding:14px 6px 14px 16px;font-size:16px;color:var(--terra);font-weight:700">$</span>
          <input type="number" style="flex:1;background:transparent;border:none;padding:14px 16px 14px 4px;font-size:16px;color:var(--ink);outline:none" id="ob-budget-inp" placeholder="500" value="${obBudget}"/>
        </div>
      </div>
      <div class="inp-wrap">
        <div class="inp-label">Up Bank token <span style="color:var(--ink4);font-weight:400;text-transform:none;letter-spacing:0;font-size:12px">(optional)</span></div>
        <input type="password" class="inp" id="ob-token-inp" placeholder="up:yeah:••••••••" value="${obToken}"/>
        <div style="font-size:12px;color:var(--ink3);margin-top:6px;line-height:1.5">Up app → Settings → API → Create token</div>
      </div>
      <button class="btn btn-p" id="ob-btn2" onclick="obFinish()" ${!obBudget?'disabled':''}>Let's go →</button>
      <button class="btn btn-g" onclick="obFinish(true)" style="margin-top:10px">Skip for now</button>`;
    const bi = document.getElementById('ob-budget-inp');
    bi.addEventListener('input', e => { obBudget=e.target.value; document.getElementById('ob-btn2').disabled=!obBudget; });
    document.getElementById('ob-token-inp').addEventListener('input', e => { obToken=e.target.value; });
  }
}

function obNext() { obStep=1; renderOb(); }
function obFinish(skip) {
  if (!skip) {
    obBudget = document.getElementById('ob-budget-inp')?.value || '500';
    obToken  = document.getElementById('ob-token-inp')?.value.trim() || '';
  }
  S = {
    userName: obName,
    habits: DEFAULT_HABITS.map(h => ({...h, done:{}, entries:{}, nights:{}})),
    budget: parseFloat(obBudget)||500,
    upToken: obToken,
    celebrated: {}
  };
  save();
  bootApp();
}

// ══════════════════════════════════════════════════════
// BOOT
// ══════════════════════════════════════════════════════
function bootApp() {
  document.getElementById('pg-onboard').classList.remove('active');
  document.getElementById('pg-app').classList.add('active');
  // Start from next Monday on fresh install
  const hasData = S.habits.some(h => Object.keys(h.done||{}).length > 0);
  if (!hasData) currentWeek = nextWeekKey();
  renderAll();
  if (S.upToken) fetchUp();
}

// ══════════════════════════════════════════════════════
// RENDER
// ══════════════════════════════════════════════════════
function renderAll() {
  const isNow = currentWeek === todayWeekKey();
  const dl = daysLeft();
  const fn = S.userName.split(' ')[0];

  document.getElementById('tb-name').textContent = `Hey, ${fn}`;
  document.getElementById('tb-sub').textContent = isNow
    ? (dl===0 ? 'Last day of the week' : `${dl} day${dl!==1?'s':''} left`)
    : fmtRange(currentWeek);
  document.getElementById('wk-range').textContent = fmtRange(currentWeek);
  document.getElementById('wk-now').textContent = isNow ? 'THIS WEEK' : '';
  document.getElementById('wk-next').disabled = isNow;

  if (currentTab === 'weekly') renderWeekly();
  else renderHistory();
}

function renderWeekly() {
  renderNudge();
  renderHero();
  renderDayStrip();
  renderDashGrid();
  renderMemory();
}

function renderNudge() {
  const isNow = currentWeek===todayWeekKey(), dl=daysLeft(), rem=S.habits.length-totalDone();
  document.getElementById('nudge-wrap').innerHTML = isNow&&rem>0&&dl<=2 ? `
    <div class="nudge fade-up">
      <div>
        <div class="nudge-txt">Don't break your streak!</div>
        <div class="nudge-sub">${rem} habit${rem!==1?'s':''} still to log this week</div>
      </div>
      <div class="nudge-badge">
        <div class="nudge-n">${dl}</div>
        <div class="nudge-lbl">day${dl!==1?'s':''} left</div>
      </div>
    </div>` : '';
}

function renderHero() {
  const done = totalDone(), total = S.habits.length;
  document.getElementById('hero-n').textContent = done;
  document.getElementById('hero-d').textContent = `/${total}`;
  document.getElementById('hero-fill').style.width = total ? `${(done/total)*100}%` : '0%';
  const statuses = ['Not started','Getting going','Halfway there','Almost there','Almost there','Complete ✦'];
  document.getElementById('hero-status').textContent = done===total&&total>0?'Complete ✦':statuses[Math.min(done,3)];
}

function renderDayStrip() {
  const dates = weekDates(currentWeek);
  const today = new Date(); today.setHours(0,0,0,0);
  document.getElementById('day-strip').innerHTML = dates.map((d,i) => {
    const isTd = d.getTime()===today.getTime();
    return `<div class="day-cell${isTd?' today':''}">
      <div class="day-l">${DAYS[i]}</div>
      <div class="day-n">${d.getDate()}</div>
      <div class="day-dot${isTd&&totalDone()>0?' on':''}"></div>
    </div>`;
  }).join('');
}

function renderDashGrid() {
  const grid = document.getElementById('dash-grid');
  let html = '';

  S.habits.forEach(h => {
    const t = tmpl(h);
    if (t.special === 'spending') return; // rendered separately as full-width

    const done = isHabitDone(h);
    const streak = getStreak(h);
    const preview = previewText(h);
    const streakHtml = streak>1 ? `<span class="streak">🔥 ${streak}w</span>` : '';

    html += `<div class="hcard${done?' done':''}" onclick="openLog('${h.id}')">
      <div class="hcard-emoji">${h.emoji}</div>
      <div class="hcard-name">${h.label}</div>
      <div class="hcard-meta">${streakHtml}${streakHtml&&t.special==='nights'?' · ':''}</div>
      ${preview ? `<div class="hcard-preview">${preview}</div>` : ''}
      <div class="hcard-check">
        <svg class="hcard-tick" width="13" height="10" viewBox="0 0 13 10" fill="none">
          <path d="M1.5 5l3.5 3.5L11.5 1" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
    </div>`;
  });

  // Spending card (full width)
  const sh = S.habits.find(h => tmpl(h).special==='spending');
  if (sh) {
    const done = isHabitDone(sh);
    const amt = upSpend !== null ? upSpend : (sh.entries[currentWeek]||{}).manualAmount ?? null;
    const over = amt!=null && amt>S.budget;
    const warn = amt!=null && !over && amt>=S.budget*0.85;
    const cls = over?'over':warn?'warn':'ok';
    const pct = amt!=null ? Math.min((amt/S.budget)*100,100) : 0;
    const streak = getStreak(sh);
    const streakHtml = streak>1 ? `<span class="streak">🔥 ${streak}w</span>` : '';

    let bodyHtml = '';
    if (upLoading) {
      bodyHtml = '<div style="font-size:13px;color:var(--ink3);font-style:italic">Syncing with Up Bank…</div>';
    } else if (upError) {
      bodyHtml = `<div style="font-size:13px;color:#c04040;margin-bottom:10px">⚠️ Could not connect to Up Bank</div>
        <div class="spend-manual">
          <input type="number" id="spend-inp" placeholder="Enter spend manually"/>
          <button onclick="saveManualSpend()">Save</button>
        </div>`;
    } else if (amt != null) {
      bodyHtml = `
        <div style="display:flex;align-items:baseline;gap:8px;margin-bottom:10px">
          <div class="spend-big ${cls}">${'$'}${Number(amt).toFixed(0)}</div>
          <div class="spend-of">/ $${S.budget}</div>
          ${S.upToken&&!upError?'<div class="spend-via">via Up ↗</div>':''}
        </div>
        <div class="spend-bar-bg"><div class="spend-bar ${over?'over':'ok'}" style="width:${pct}%"></div></div>
        <div class="spend-st ${cls}">${over?`$${(amt-S.budget).toFixed(0)} over budget`:done?`$${(S.budget-amt).toFixed(0)} under — on track ✦`:`$${(S.budget-amt).toFixed(0)} remaining`}</div>
        ${!S.upToken?`<div class="spend-manual" style="margin-top:12px"><input type="number" id="spend-inp" placeholder="Update"/><button onclick="saveManualSpend()">Save</button></div>`:''}`;
    } else {
      bodyHtml = `
        <div style="font-size:14px;color:var(--ink3);margin-bottom:12px">Connect Up Bank to sync automatically, or enter manually.</div>
        <div class="spend-manual">
          <input type="number" id="spend-inp" placeholder="This week's spend"/>
          <button onclick="saveManualSpend()">Save</button>
        </div>
        ${!S.upToken?`<button onclick="openSheet('sh-settings')" style="margin-top:10px;background:none;border:1.5px solid var(--line);border-radius:10px;padding:8px 14px;font-size:13px;font-weight:600;color:var(--terra);cursor:pointer;width:100%">Connect Up Bank →</button>`:''}`;
    }

    html += `<div class="spend-card${done?' done':''} wide" onclick="void(0)">
      <div class="spend-top">
        <div style="font-size:28px">${sh.emoji}</div>
        <div style="flex:1">
          <div style="font-size:16px;font-weight:700;color:var(--ink)">${sh.label}</div>
          <div style="font-size:12px;color:var(--ink3);margin-top:3px">${streakHtml} Goal: $${S.budget}/wk</div>
        </div>
      </div>
      <div class="spend-body">${bodyHtml}</div>
    </div>`;
  }

  // Add habit button
  html += `<div class="add-card" onclick="openAddHabit()">
    <div class="add-card-icon">＋</div>
    <div class="add-card-label">Add habit</div>
  </div>`;

  grid.innerHTML = html;

  // Make wide cards span full grid
  grid.querySelectorAll('.wide').forEach(el => el.style.gridColumn = '1/-1');
}

function renderMemory() {
  const lastMonth = offsetWeek(todayWeekKey(), -4);
  const memos = S.habits.map(h => ({h, p:previewText(h, lastMonth)})).filter(x=>x.p);
  const wrap = document.getElementById('memory-wrap');
  if (!memos.length) { wrap.innerHTML=''; return; }
  wrap.innerHTML = `
    <div class="sec-label">This time last month</div>
    <div style="background:linear-gradient(145deg,#fdf0e6,#f9e8d8);border-radius:22px;padding:18px 20px;margin-bottom:28px;border:1px solid rgba(196,113,74,.15);box-shadow:0 4px 14px rgba(196,113,74,.08)">
      ${memos.map(({h,p})=>`
        <div style="display:flex;gap:12px;margin-bottom:10px;align-items:flex-start">
          <span style="font-size:18px">${h.emoji}</span>
          <div style="font-family:'Cormorant Garamond',Georgia,serif;font-size:16px;font-style:italic;color:#5a4a3a;flex:1;line-height:1.5">
            <span style="font-weight:600;font-style:normal;color:var(--terra2)">${h.label}:</span> ${p}
          </div>
        </div>`).join('')}
    </div>`;
}

function renderHistory() {
  const thisWeek = todayWeekKey();
  const histWeeks = Array.from({length:12}, (_,i)=>offsetWeek(thisWeek,-i));
  const perfectCount = histWeeks.filter(wk=>totalDone(wk)===S.habits.length).length;
  const bestStreak = S.habits.length > 0 ? Math.max(...S.habits.map(h=>getStreak(h)), 0) : 0;
  const totalAll = S.habits.reduce((acc,h)=>acc+Object.values(h.done||{}).filter(Boolean).length,0);

  document.getElementById('stat-row').innerHTML = [
    {v:perfectCount, l:'Perfect weeks'},
    {v:bestStreak,   l:'Best streak'},
    {v:totalAll,     l:'Total logged'},
  ].map(s=>`<div class="stat-card">
    <div class="stat-v serif">${s.v}</div>
    <div class="stat-l">${s.l}</div>
  </div>`).join('');

  document.getElementById('hist-list').innerHTML = histWeeks.map(wk => {
    const score = totalDone(wk), perfect = score===S.habits.length&&S.habits.length>0;
    return `<div class="hist-row${wk===currentWeek?' cur':''}" onclick="jumpWeek('${wk}')">
      <div class="hist-date">${fmtRange(wk)}</div>
      <div class="hist-pips">${S.habits.map(h=>`
        <div class="hist-pip${isHabitDone(h,wk)?(perfect?' perfect':' done'):''}">${isHabitDone(h,wk)?h.emoji:''}</div>`).join('')}</div>
      <div class="hist-sc${perfect?' full':''}">${score}/${S.habits.length}</div>
    </div>`;
  }).join('');
}

// ══════════════════════════════════════════════════════
// LOG SHEET
// ══════════════════════════════════════════════════════
function openLog(id) {
  loggingId = id;
  const h = S.habits.find(x=>x.id===id);
  const t = tmpl(h);
  const e = h.entries[currentWeek] || {};
  _starRating = e.rating || 0;
  _nightsSel = [...(h.nights[currentWeek] || [])];

  let fieldsHtml = '';

  if (t.special === 'nights') {
    const target = t.target||3;
    const nightsHtml = DAYS.map((l,i)=>`<button class="night-btn${_nightsSel.includes(i)?' on':''}" onclick="toggleNightLog(${i})">${l}</button>`).join('');
    fieldsHtml = `
      <div class="inp-wrap">
        <div class="inp-label">Tap nights you read</div>
        <div class="night-grid">${nightsHtml}</div>
        <div style="font-size:13px;color:var(--ink3);font-weight:600;margin-top:6px">
          <span style="color:var(--terra);font-weight:800">${_nightsSel.length}</span>/${target} nights
        </div>
      </div>
      <div class="inp-wrap">
        <div class="inp-label">Book</div>
        <input type="text" class="inp" id="lf-book" placeholder="What are you reading?" value="${e.book||''}"/>
      </div>
      <div class="inp-wrap">
        <div class="inp-label">Rating <span style="color:var(--ink4);font-weight:400;text-transform:none;letter-spacing:0;font-size:12px">optional</span></div>
        <div class="stars">${[1,2,3,4,5].map(n=>`<span class="star${_starRating>=n?' on':''}" onclick="setStarLog(${n})">★</span>`).join('')}</div>
      </div>`;
  } else if (t.special === 'spending') {
    // Spending is handled inline in the card
    closeSheet('sh-log'); return;
  } else {
    t.fields.forEach(f => {
      if (f.type==='text') {
        fieldsHtml += `<div class="inp-wrap">
          <div class="inp-label">${f.label}${f.optional?' <span style="color:var(--ink4);font-weight:400;text-transform:none;letter-spacing:0;font-size:12px">optional</span>':''}</div>
          <input type="text" class="inp" id="lf-${f.id}" placeholder="${f.placeholder}" value="${e[f.id]||''}"/>
        </div>`;
      } else if (f.type==='textarea') {
        fieldsHtml += `<div class="inp-wrap">
          <div class="inp-label">${f.label}${f.optional?' <span style="color:var(--ink4);font-weight:400;text-transform:none;letter-spacing:0;font-size:12px">optional</span>':''}</div>
          <textarea class="inp" id="lf-${f.id}" placeholder="${f.placeholder}" rows="2">${e[f.id]||''}</textarea>
        </div>`;
      } else if (f.type==='stars') {
        fieldsHtml += `<div class="inp-wrap">
          <div class="inp-label">${f.label}</div>
          <div class="stars">${[1,2,3,4,5].map(n=>`<span class="star${_starRating>=n?' on':''}" onclick="setStarLog(${n})">★</span>`).join('')}</div>
        </div>`;
      }
    });
  }

  document.getElementById('sh-log-body').innerHTML = `
    <div class="sh-head">
      <div class="sh-emoji">${h.emoji}</div>
      <div>
        <div class="sh-title">${h.label}</div>
        <div style="font-size:13px;color:var(--ink3)">Log this week</div>
      </div>
    </div>
    <div style="margin-top:20px">${fieldsHtml}</div>
    <div class="btn-row">
      <button class="btn-sm btn-sm-g" onclick="closeSheet('sh-log')">Cancel</button>
      <button class="btn-sm btn-sm-p" style="flex:1" onclick="saveLog()">
        ${isHabitDone(h) ? 'Update' : 'Mark done ✦'}
      </button>
    </div>`;

  openSheet('sh-log');
  setTimeout(() => document.querySelector('#sh-log .inp')?.focus(), 350);
}

function toggleNightLog(i) {
  _nightsSel = _nightsSel.includes(i) ? _nightsSel.filter(d=>d!==i) : [..._nightsSel, i];
  // Re-render night buttons
  document.querySelectorAll('#sh-log .night-btn').forEach((btn,idx) => {
    btn.classList.toggle('on', _nightsSel.includes(idx));
  });
  const h = S.habits.find(x=>x.id===loggingId);
  const target = (tmpl(h).target)||3;
  const countEl = document.querySelector('#sh-log .inp-wrap div[style]');
  if (countEl) countEl.innerHTML = `<span style="color:var(--terra);font-weight:800">${_nightsSel.length}</span>/${target} nights`;
}

function setStarLog(n) {
  _starRating = n;
  document.querySelectorAll('#sh-log .star').forEach((s,i) => s.classList.toggle('on', i<n));
}

function saveLog() {
  const h = S.habits.find(x=>x.id===loggingId);
  const t = tmpl(h);
  const e = {};

  if (t.special === 'nights') {
    h.nights[currentWeek] = _nightsSel;
    const book = document.getElementById('lf-book')?.value.trim() || '';
    if (book || _starRating) {
      h.entries[currentWeek] = {...(h.entries[currentWeek]||{}), book, rating:_starRating};
    }
  } else {
    t.fields.forEach(f => {
      if (f.type==='stars') { e.rating = _starRating; }
      else { const el=document.getElementById(`lf-${f.id}`); if(el) e[f.id]=el.value.trim(); }
    });
    h.entries[currentWeek] = e;
    // Auto-mark done if any required field is filled
    const hasData = t.fields.filter(f=>!f.optional).some(f=>{
      if(f.type==='stars') return _starRating>0;
      return !!(e[f.id]);
    });
    const allOptional = t.fields.every(f=>f.optional);
    if (hasData || allOptional) h.done[currentWeek] = true;
  }

  // Check if nights target met
  if (t.special==='nights') {
    h.done[currentWeek] = _nightsSel.length >= (t.target||3);
  }

  save();
  closeSheet('sh-log');
  checkCelebrate();
  renderWeekly();
}

// ══════════════════════════════════════════════════════
// ADD / EDIT HABIT
// ══════════════════════════════════════════════════════
let _newEmoji = '✨';
let _newLabel = '';
let _newTemplateId = 'simple';
let _habitStep = 0;

function openAddHabit() {
  editingId = null;
  _newEmoji = '✨'; _newLabel = ''; _newTemplateId = 'simple'; _habitStep = 0;
  renderHabitSheet();
  openSheet('sh-habit');
}

function openEditHabit(id) {
  editingId = id;
  const h = S.habits.find(x=>x.id===id);
  _newEmoji = h.emoji; _newLabel = h.label; _newTemplateId = h.templateId; _habitStep = 0;
  renderHabitSheet();
  openSheet('sh-habit');
}

function renderHabitSheet() {
  if (_habitStep === 0) {
    const emojiHtml = EMOJIS.map(em=>
      `<button class="em-btn${_newEmoji===em?' sel':''}" onclick="selectEmoji('${em}')">${em}</button>`
    ).join('');
    document.getElementById('sh-habit-body').innerHTML = `
      <div class="sh-title">${editingId ? 'Edit habit' : 'New habit'}</div>
      <div class="sh-sub">${editingId ? 'Update your habit details.' : 'What do you want to track?'}</div>
      <div class="inp-wrap">
        <div class="inp-label">Name</div>
        <input type="text" class="inp" id="nh-label" placeholder="e.g. Weekly date" value="${_newLabel}" oninput="_newLabel=this.value"/>
      </div>
      <div class="inp-wrap">
        <div class="inp-label">Emoji</div>
        <div class="emoji-grid">${emojiHtml}</div>
      </div>
      <div class="btn-row">
        <button class="btn-sm btn-sm-g" onclick="closeSheet('sh-habit')">Cancel</button>
        <button class="btn-sm btn-sm-p" style="flex:1" onclick="habitNext()">
          ${editingId ? 'Save' : 'Choose template →'}
        </button>
      </div>
      ${editingId ? `<button class="del-btn" onclick="deleteHabit('${editingId}')">Delete habit</button>` : ''}`;
    setTimeout(()=>document.getElementById('nh-label')?.focus(),350);
  } else {
    const tmplHtml = TEMPLATES.map(t=>`
      <div class="tmpl-row${_newTemplateId===t.id?' sel':''}" onclick="selectTmpl('${t.id}')">
        <div class="tmpl-icon">${t.icon}</div>
        <div class="tmpl-info">
          <div class="tmpl-name">${t.name}</div>
          <div class="tmpl-desc">${t.desc}</div>
        </div>
        <div class="tmpl-check">${_newTemplateId===t.id?'<svg width="11" height="9" viewBox="0 0 11 9" fill="none"><path d="M1 4.5l3 3L10 1" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>':''}</div>
      </div>`).join('');
    document.getElementById('sh-habit-body').innerHTML = `
      <div class="sh-title">What kind of habit?</div>
      <div class="sh-sub">Choose what you'll log each week.</div>
      <div class="tmpl-list">${tmplHtml}</div>
      <div class="btn-row">
        <button class="btn-sm btn-sm-g" onclick="_habitStep=0;renderHabitSheet()">← Back</button>
        <button class="btn-sm btn-sm-p" style="flex:1" onclick="saveHabit()">Add habit ✦</button>
      </div>`;
  }
}

function selectEmoji(em) { _newEmoji=em; renderHabitSheet(); }
function selectTmpl(id) { _newTemplateId=id; renderHabitSheet(); }

function habitNext() {
  _newLabel = document.getElementById('nh-label')?.value.trim() || _newLabel;
  if (!_newLabel) { document.getElementById('nh-label')?.focus(); return; }
  if (editingId) {
    const h = S.habits.find(x=>x.id===editingId);
    h.label = _newLabel; h.emoji = _newEmoji; h.templateId = _newTemplateId;
    save(); closeSheet('sh-habit'); renderWeekly();
  } else {
    _habitStep = 1; renderHabitSheet();
  }
}

function saveHabit() {
  if (!_newLabel) return;
  const newH = {
    id: 'h_' + Date.now(),
    label: _newLabel, emoji: _newEmoji, templateId: _newTemplateId,
    done:{}, entries:{}, nights:{}
  };
  S.habits.push(newH);
  save(); closeSheet('sh-habit'); renderWeekly();
}

function deleteHabit(id) {
  if (!confirm('Delete this habit?')) return;
  S.habits = S.habits.filter(h=>h.id!==id);
  save(); closeSheet('sh-habit'); renderWeekly();
}

// ══════════════════════════════════════════════════════
// SETTINGS
// ══════════════════════════════════════════════════════
function openSheet(id) {
  if (id==='sh-settings') {
    document.getElementById('set-name').value = S.userName;
    document.getElementById('set-budget').value = S.budget;
    document.getElementById('set-token').value = S.upToken||'';
  }
  document.getElementById(id).classList.add('open');
  document.body.style.overflow='hidden';
}
function closeSheet(id) {
  document.getElementById(id).classList.remove('open');
  document.body.style.overflow='';
}
function maybeClose(e, id) { if(e.target===document.getElementById(id)) closeSheet(id); }

function saveSettings() {
  const name = document.getElementById('set-name').value.trim();
  const budget = parseFloat(document.getElementById('set-budget').value)||500;
  const token = document.getElementById('set-token').value.trim();
  if (name) S.userName = name;
  S.budget = budget; S.upToken = token;
  save();
  closeSheet('sh-settings');
  if (token) { upSpend=null; fetchUp(); }
  renderAll();
}

// ══════════════════════════════════════════════════════
// WEEK NAV
// ══════════════════════════════════════════════════════
function changeWeek(dir) {
  currentWeek = offsetWeek(currentWeek, dir);
  if (S.upToken && currentWeek===todayWeekKey()) fetchUp();
  else if (dir!==0) { upSpend=null; }
  renderAll();
}
function jumpWeek(wk) { currentWeek=wk; switchTab('weekly'); }

function switchTab(tab) {
  currentTab = tab;
  document.getElementById('sc-weekly').style.display = tab==='weekly'?'block':'none';
  document.getElementById('sc-history').style.display = tab==='history'?'block':'none';
  document.querySelectorAll('.pill').forEach(p => p.classList.toggle('active', p.textContent.toLowerCase().startsWith(tab.slice(0,4))));
  renderAll();
}

// ══════════════════════════════════════════════════════
// SPENDING
// ══════════════════════════════════════════════════════
function saveManualSpend() {
  const inp = document.getElementById('spend-inp');
  const amt = parseFloat(inp?.value);
  if (isNaN(amt)) return;
  const sh = S.habits.find(h=>tmpl(h).special==='spending');
  if (!sh) return;
  sh.entries[currentWeek] = {...(sh.entries[currentWeek]||{}), manualAmount:amt};
  sh.done[currentWeek] = amt <= S.budget;
  save(); inp.value='';
  checkCelebrate();
  renderWeekly();
}

function fetchUp() {
  if (!S.upToken) return;
  upLoading=true; upError=null;
  fetch(`/.netlify/functions/up-spend?weekKey=${currentWeek}`, {
    headers:{Authorization:`Bearer ${S.upToken}`}
  })
  .then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); })
  .then(j=>{
    upSpend=j.total; upLoading=false; upError=null;
    const sh=S.habits.find(h=>tmpl(h).special==='spending');
    if(sh){ sh.done[currentWeek]=upSpend<=S.budget; save(); }
    checkCelebrate();
    if(currentTab==='weekly') renderWeekly();
  })
  .catch(e=>{ upError=e.message; upLoading=false; upSpend=null; if(currentTab==='weekly') renderWeekly(); });
}

// ══════════════════════════════════════════════════════
// CELEBRATE
// ══════════════════════════════════════════════════════
function checkCelebrate() {
  const done=totalDone(), total=S.habits.length;
  if (done===total && total>0 && !S.celebrated[currentWeek]) {
    S.celebrated[currentWeek]=true; save();
    celebrate();
  }
}

function celebrate() {
  const fn=S.userName.split(' ')[0];
  const toast=document.getElementById('toast');
  document.getElementById('toast-t').textContent=`Perfect week, ${fn}!`;
  document.getElementById('toast-s').textContent=`All ${S.habits.length} habits done.`;
  toast.classList.add('show');
  setTimeout(()=>toast.classList.remove('show'),3200);
  launchConfetti();
}

function launchConfetti() {
  const wrap=document.getElementById('confetti-wrap'); wrap.innerHTML='';
  const cols=['#c4714a','#d4836a','#f0ddd5','#c48838','#8c4428','#f9e8d8'];
  for(let i=0;i<60;i++){
    const el=document.createElement('div'); el.className='confetti-piece';
    const sz=Math.random()*8+4;
    el.style.cssText=`left:${Math.random()*100}%;width:${sz}px;height:${sz*1.5}px;background:${cols[i%6]};border-radius:${Math.random()>.5?'50%':'2px'};animation:cf-fall ${.8+Math.random()*1}s linear ${Math.random()*.6}s both`;
    wrap.appendChild(el);
  }
  setTimeout(()=>wrap.innerHTML='',3200);
}

// ══════════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════════
(function init() {
  S = load();
  if (S && S.habits) {
    // Migrate old habit format if needed
    S.habits = S.habits.map(h => ({
      ...h,
      done: h.done||{}, entries: h.entries||{}, nights: h.nights||{}
    }));
    S.userName = 'Soph';
    save();
    bootApp();
  } else {
    S = {
      userName: 'Soph',
      habits: DEFAULT_HABITS.map(h => ({...h, done:{}, entries:{}, nights:{}})),
      budget: 500,
      upToken: '',
      celebrated: {}
    };
    save();
    bootApp();
  }
})();
</script>

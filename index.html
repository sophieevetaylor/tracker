<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Sophie's Lists</title>
<link rel="icon" href="icon.png"/>
<link rel="apple-touch-icon" href="icon.png"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="Lists"/>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap');

:root{
  --bg:#f5f2ee;
  --card:#ffffff;
  --ink:#18140f;
  --ink2:#52443a;
  --ink3:#9a8c80;
  --ink4:#c4b8ac;
  --sh:rgba(80,50,20,.08);
  --sh2:rgba(80,50,20,.04);
  --r:18px;

  --today-ac:#e05c3a; --today-acL:#f07050; --today-bg:#fef3ef;
  --work-ac:#3d6b9e;  --work-acL:#5a88bc;  --work-bg:#eef3f9;
  --admin-ac:#c4714a; --admin-acL:#d4836a; --admin-bg:#fdf5f0;
  --groc-ac:#4a8a5a;  --groc-acL:#5aa06a;  --groc-bg:#eef5f0;
  --fun-ac:#8a5aaa;   --fun-acL:#a070c8;   --fun-bg:#f4eff9;

  --ac:var(--today-ac); --acL:var(--today-acL); --ac-bg:var(--today-bg);
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{font-family:'DM Sans',-apple-system,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100vh;overflow:hidden}
button,input,textarea{font-family:'DM Sans',-apple-system,sans-serif}

/* ── shell ── */
.app{display:flex;flex-direction:column;height:100vh;max-width:430px;margin:0 auto;position:relative;overflow:hidden}

/* ── header ── */
.hdr{
  padding:env(safe-area-inset-top,20px) 22px 0;
  background:linear-gradient(var(--bg) 85%,transparent);
  position:relative;z-index:15;flex-shrink:0
}
.hdr-row{display:flex;align-items:flex-end;justify-content:space-between;padding-bottom:16px}
.hdr-greeting{font-size:13px;font-weight:500;color:var(--ink3)}
.hdr-title{font-family:'Cormorant Garamond',Georgia,serif;font-size:30px;font-weight:400;font-style:italic;color:var(--ink);margin-top:2px}
.hdr-title span{color:var(--ac);transition:color .3s}
.hdr-right{display:flex;gap:8px;align-items:center;padding-bottom:4px}
.icon-btn{width:38px;height:38px;border-radius:50%;background:var(--card);border:1.5px solid rgba(0,0,0,.08);box-shadow:0 2px 8px var(--sh);display:flex;align-items:center;justify-content:center;font-size:17px;cursor:pointer;transition:all .2s;flex-shrink:0}
.icon-btn:hover{box-shadow:0 4px 14px var(--sh)}
.search-bar{
  display:flex;align-items:center;gap:10px;
  background:var(--card);border-radius:14px;
  border:1.5px solid rgba(0,0,0,.07);
  box-shadow:0 2px 8px var(--sh2);
  padding:10px 14px;margin-bottom:14px;
}
.search-bar input{flex:1;border:none;background:transparent;outline:none;font-size:15px;color:var(--ink)}
.search-bar input::placeholder{color:var(--ink4)}
.search-icon{color:var(--ink4);font-size:16px;flex-shrink:0}

/* ── scroll ── */
.scroll{flex:1;overflow-y:auto;padding:4px 22px 20px;-webkit-overflow-scrolling:touch}

/* ── today header cards ── */
.today-meta{display:flex;gap:10px;margin-bottom:18px}
.meta-card{flex:1;background:var(--card);border-radius:16px;padding:14px 14px 12px;border:1px solid rgba(0,0,0,.06);box-shadow:0 2px 10px var(--sh2)}
.meta-n{font-family:'Cormorant Garamond',Georgia,serif;font-size:34px;font-weight:300;color:var(--ink);line-height:1}
.meta-n.hot{color:var(--today-ac)}
.meta-l{font-size:10px;font-weight:700;color:var(--ink4);letter-spacing:.1em;text-transform:uppercase;margin-top:4px}

/* ── section headers ── */
.sec-hdr{display:flex;align-items:center;justify-content:space-between;margin:18px 0 10px}
.sec-title{font-size:11px;font-weight:700;color:var(--ink4);letter-spacing:.14em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.sec-title::after{content:'';display:block;width:30px;height:1px;background:linear-gradient(90deg,rgba(0,0,0,.1),transparent)}
.sec-from{font-size:12px;font-weight:600;color:var(--ink4)}
.sec-em{font-size:16px;margin-right:2px}

/* ── task card ── */
.task-wrap{position:relative;margin-bottom:8px;border-radius:var(--r);overflow:hidden}
.swipe-bg-left{
  position:absolute;inset:0;border-radius:var(--r);
  background:linear-gradient(90deg,#4a9a5a,#3a8a4a);
  display:flex;align-items:center;padding-left:22px;
  opacity:0;transition:opacity .15s
}
.swipe-bg-right{
  position:absolute;inset:0;border-radius:var(--r);
  background:linear-gradient(90deg,#e05050,#c03030);
  display:flex;align-items:center;justify-content:flex-end;padding-right:22px;
  opacity:0;transition:opacity .15s
}
.swipe-icon{font-size:22px}

.task{
  background:var(--card);border-radius:var(--r);
  border:1.5px solid rgba(0,0,0,.06);
  box-shadow:0 2px 10px var(--sh2);
  transition:transform .18s,box-shadow .2s;
  position:relative;z-index:1;cursor:pointer;
}
.task:active{box-shadow:0 1px 4px var(--sh2)}
.task.done{opacity:.6}
.task.dragging{box-shadow:0 12px 40px var(--sh);transform:scale(1.02);z-index:50;opacity:.95}

.task-inner{display:flex;align-items:center;gap:11px;padding:14px 14px 14px 16px}
.task-check{
  width:26px;height:26px;border-radius:50%;flex-shrink:0;
  border:2px solid rgba(0,0,0,.15);background:transparent;
  display:flex;align-items:center;justify-content:center;
  transition:all .22s cubic-bezier(.34,1.56,.64,1)
}
.task.done .task-check{background:var(--ac);border-color:var(--ac);box-shadow:0 2px 8px rgba(0,0,0,.18)}
/* per-tab check colours */
.task.tab-work    .task-check{border-color:rgba(61,107,158,.35)}
.task.tab-work.done .task-check{background:var(--work-ac);border-color:var(--work-ac)}
.task.tab-admin   .task-check{border-color:rgba(196,113,74,.35)}
.task.tab-admin.done .task-check{background:var(--admin-ac);border-color:var(--admin-ac)}
.task.tab-groc    .task-check{border-color:rgba(74,138,90,.35)}
.task.tab-groc.done .task-check{background:var(--groc-ac);border-color:var(--groc-ac)}
.task.tab-fun     .task-check{border-color:rgba(138,90,170,.35)}
.task.tab-fun.done .task-check{background:var(--fun-ac);border-color:var(--fun-ac)}

.task-tick{opacity:0;transform:scale(0);transition:all .2s cubic-bezier(.34,1.56,.64,1)}
.task.done .task-tick{opacity:1;transform:scale(1)}

/* priority left stripe */
.task::before{content:'';position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:2px;transition:background .2s}
.p-high::before{background:#e05050}
.p-med::before{background:#e09030}
.p-low::before{background:transparent}

.task-body{flex:1;min-width:0}
.task-title{font-size:15px;font-weight:600;color:var(--ink);line-height:1.3;transition:all .2s}
.task.done .task-title{text-decoration:line-through;text-decoration-color:var(--ink4);color:var(--ink3)}
.task-sub{display:flex;align-items:center;gap:8px;margin-top:4px;flex-wrap:wrap}
.task-note{font-size:12px;color:var(--ink3);font-style:italic;line-height:1.3}
.task.done .task-note{text-decoration:line-through;text-decoration-color:var(--ink4)}
.task-chip{
  display:inline-flex;align-items:center;gap:3px;
  font-size:10px;font-weight:700;border-radius:8px;padding:2px 7px;
  letter-spacing:.03em;flex-shrink:0
}
.chip-due{background:rgba(224,92,58,.12);color:#c04030}
.chip-due.today-due{background:rgba(224,92,58,.18);color:#c04030}
.chip-due.overdue{background:rgba(200,40,40,.15);color:#b02020}
.chip-rec{background:rgba(74,138,90,.12);color:#3a7a4a}
.chip-from{font-size:10px;font-weight:700;border-radius:8px;padding:2px 8px}
.chip-work{background:rgba(61,107,158,.12);color:var(--work-ac)}
.chip-admin{background:rgba(196,113,74,.12);color:var(--admin-ac)}
.chip-groc{background:rgba(74,138,90,.12);color:var(--groc-ac)}
.chip-fun{background:rgba(138,90,170,.12);color:var(--fun-ac)}

.task-more{background:none;border:none;font-size:18px;color:var(--ink4);cursor:pointer;padding:2px 4px;border-radius:8px;flex-shrink:0;transition:color .15s;line-height:1}
.task-more:hover{color:var(--ac)}

.task-drag-handle{
  color:var(--ink4);font-size:14px;cursor:grab;padding:0 2px 0 0;flex-shrink:0;
  touch-action:none;line-height:1
}
.task-drag-handle:active{cursor:grabbing}

/* ── recurring badge ── */
.rec-dot{width:7px;height:7px;border-radius:50%;background:#4a8a5a;display:inline-block;margin-left:4px;vertical-align:middle}

/* ── done section ── */
.done-section{margin-top:14px}
.done-toggle{
  display:flex;align-items:center;gap:8px;background:none;border:none;cursor:pointer;
  font-size:13px;font-weight:700;color:var(--ink3);padding:8px 0;width:100%;transition:color .15s
}
.done-toggle:hover{color:var(--ink2)}
.done-arr{font-size:12px;transition:transform .2s;display:inline-block}
.done-arr.open{transform:rotate(90deg)}
.done-count{background:rgba(0,0,0,.08);color:var(--ink3);font-size:10px;font-weight:800;border-radius:10px;padding:1px 7px;margin-left:2px}
.done-body{display:none}
.done-body.open{display:block}
.clear-btn{
  display:flex;align-items:center;gap:6px;
  background:none;border:1.5px solid rgba(200,50,50,.2);color:#c04040;
  border-radius:12px;padding:9px 14px;font-size:13px;font-weight:700;
  cursor:pointer;margin-top:8px;transition:all .2s;width:100%;justify-content:center
}
.clear-btn:hover{background:rgba(200,50,50,.06)}

/* ── empty ── */
.empty{text-align:center;padding:56px 20px}
.empty-em{font-size:52px;margin-bottom:14px}
.empty-t{font-family:'Cormorant Garamond',Georgia,serif;font-size:22px;font-style:italic;color:var(--ink3);margin-bottom:6px}
.empty-s{font-size:14px;color:var(--ink4);line-height:1.5}

/* ── bottom nav ── */
.bottom-nav{
  display:flex;align-items:stretch;
  background:rgba(255,255,255,.95);backdrop-filter:blur(20px);
  border-top:1px solid rgba(0,0,0,.08);
  padding:8px 0 env(safe-area-inset-bottom,8px);
  flex-shrink:0;position:relative;z-index:20
}
.nav-item{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  background:none;border:none;cursor:pointer;padding:6px 4px 2px;
  transition:all .2s;position:relative
}
.nav-item.active .nav-icon{transform:scale(1.12)}
.nav-icon{font-size:24px;transition:transform .2s;line-height:1}
.nav-label{font-size:10px;font-weight:700;color:var(--ink4);letter-spacing:.03em;transition:color .2s}
.nav-item.active .nav-label{color:var(--ac)}
.nav-badge{
  position:absolute;top:2px;right:calc(50% - 18px);
  background:#e05050;color:#fff;font-size:9px;font-weight:800;
  border-radius:10px;padding:1px 5px;min-width:16px;text-align:center;
  border:1.5px solid var(--bg)
}
.nav-active-dot{
  position:absolute;bottom:0;left:50%;transform:translateX(-50%);
  width:4px;height:4px;border-radius:50%;background:var(--ac);
  opacity:0;transition:opacity .2s
}
.nav-item.active .nav-active-dot{opacity:1}

/* ── add fab + bar ── */
.add-area{
  position:fixed;bottom:env(safe-area-inset-bottom,0px);left:50%;transform:translateX(-50%);
  width:100%;max-width:430px;
  padding:0 18px calc(env(safe-area-inset-bottom,0px) + 72px);
  pointer-events:none;z-index:25
}
.add-pill{
  display:flex;align-items:center;gap:8px;
  background:var(--card);border-radius:22px;
  border:1.5px solid rgba(0,0,0,.08);
  box-shadow:0 6px 28px var(--sh),0 2px 6px var(--sh2);
  padding:9px 9px 9px 18px;
  pointer-events:all;
  transform:translateY(0);transition:transform .25s cubic-bezier(.33,1,.68,1),opacity .2s;
}
.add-pill.hidden{transform:translateY(80px);opacity:0;pointer-events:none}
.add-inp{flex:1;border:none;background:transparent;outline:none;font-size:16px;color:var(--ink);min-width:0}
.add-inp::placeholder{color:var(--ink4)}
.add-pris{display:flex;gap:3px}
.apri{
  width:30px;height:30px;border-radius:10px;border:none;
  font-size:12px;font-weight:800;cursor:pointer;transition:all .15s;
  background:transparent;color:var(--ink4)
}
.apri:hover{background:rgba(0,0,0,.06)}
.apri.h{background:rgba(224,80,80,.15);color:#d04040}
.apri.m{background:rgba(224,144,48,.15);color:#c07020}
.apri.l{background:rgba(100,90,80,.1);color:var(--ink3)}
.add-go{
  width:40px;height:40px;border-radius:14px;border:none;
  background:linear-gradient(145deg,var(--acL),var(--ac));
  color:#fff;font-size:22px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 3px 12px rgba(0,0,0,.2);transition:all .2s;flex-shrink:0
}
.add-go:hover{transform:scale(1.07)}

/* ── sheets ── */
.overlay{
  position:fixed;inset:0;background:rgba(10,5,0,.42);
  backdrop-filter:blur(5px);z-index:100;
  display:flex;align-items:flex-end;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .22s
}
.overlay.open{opacity:1;pointer-events:all}
.sheet{
  background:var(--card);border-radius:26px 26px 0 0;
  width:100%;max-width:430px;padding:0 22px 48px;
  max-height:90vh;overflow-y:auto;
  transform:translateY(100%);
  box-shadow:0 -6px 32px rgba(0,0,0,.1);
  transition:transform .3s cubic-bezier(.32,0,.67,0)
}
.overlay.open .sheet{transform:translateY(0);transition:transform .35s cubic-bezier(.33,1,.68,1)}
.sh-handle{width:40px;height:4px;background:#e0d8d0;border-radius:2px;margin:14px auto 20px}
.sh-title{font-family:'Cormorant Garamond',Georgia,serif;font-size:24px;font-style:italic;color:var(--ink);margin-bottom:18px}
.inp{width:100%;background:#faf8f4;border:1.5px solid rgba(0,0,0,.1);border-radius:13px;padding:13px 14px;font-size:15px;color:var(--ink);outline:none;transition:all .2s}
.inp:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(0,0,0,.05)}
.inp::placeholder{color:var(--ink4)}
textarea.inp{resize:none;min-height:80px;line-height:1.6}
.iw{margin-bottom:16px}
.il{font-size:10px;font-weight:700;color:var(--ink3);letter-spacing:.14em;text-transform:uppercase;margin-bottom:7px}
.pri-row{display:flex;gap:8px;margin-bottom:16px}
.po{flex:1;padding:11px;border-radius:12px;border:2px solid rgba(0,0,0,.08);background:#faf8f4;font-size:13px;font-weight:700;color:var(--ink3);cursor:pointer;text-align:center;transition:all .2s}
.po.sh{background:rgba(224,80,80,.1);border-color:rgba(224,80,80,.3);color:#c04040}
.po.sm{background:rgba(224,144,48,.1);border-color:rgba(224,144,48,.3);color:#c07020}
.po.sl{background:rgba(100,90,80,.08);border-color:rgba(100,90,80,.2);color:var(--ink3)}
.btn-row{display:flex;gap:10px;margin-top:6px}
.bsp{padding:12px 20px;width:auto;border-radius:12px;border:none;font-size:14px;font-weight:700;cursor:pointer;transition:all .2s}
.bsp.p{background:linear-gradient(145deg,var(--acL),var(--ac));color:#fff;box-shadow:0 3px 10px rgba(0,0,0,.15)}
.bsp.p:hover{transform:translateY(-1px)}
.bsp.g{background:rgba(0,0,0,.06);color:var(--ink3)}
.del{width:100%;padding:13px;border-radius:12px;border:1.5px solid rgba(200,50,50,.2);background:rgba(200,50,50,.06);color:#c04040;font-size:14px;font-weight:700;cursor:pointer;margin-top:16px;transition:all .2s}
.del:hover{background:rgba(200,50,50,.12)}

/* recurrence picker */
.rec-opts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.rec-opt{padding:9px 16px;border-radius:20px;border:1.5px solid rgba(0,0,0,.1);background:#faf8f4;font-size:13px;font-weight:600;color:var(--ink3);cursor:pointer;transition:all .2s}
.rec-opt.sel{background:rgba(74,138,90,.1);border-color:rgba(74,138,90,.3);color:#3a7a4a}

/* date input */
input[type=date].inp{color-scheme:light}

/* ── completion burst ── */
@keyframes burst{0%{transform:scale(1)}40%{transform:scale(1.35)}70%{transform:scale(.92)}100%{transform:scale(1)}}
.burst{animation:burst .35s cubic-bezier(.34,1.56,.64,1)}

@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.fade-up{animation:fadeUp .25s cubic-bezier(.33,1,.68,1) both}

/* ── confetti ── */
.cp{position:fixed;top:-10px;border-radius:3px;pointer-events:none;z-index:300}
@keyframes cf{0%{transform:translateY(0) rotate(0deg);opacity:1}85%{opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}

/* ── toast ── */
.toast{
  position:fixed;left:50%;bottom:90px;z-index:301;
  background:rgba(255,253,249,.97);backdrop-filter:blur(20px);
  border-radius:24px;padding:16px 26px;
  border:1px solid rgba(0,0,0,.08);
  box-shadow:0 12px 48px rgba(0,0,0,.14);
  text-align:center;pointer-events:none;white-space:nowrap;
  transform:translateX(-50%) scale(.85) translateY(16px);opacity:0;
  transition:all .4s cubic-bezier(.34,1.56,.64,1)
}
.toast.show{opacity:1;transform:translateX(-50%) scale(1) translateY(0)}
.toast-t{font-family:'Cormorant Garamond',Georgia,serif;font-size:18px;font-style:italic;color:var(--ink)}
.toast-s{font-size:12px;color:var(--ink3);margin-top:3px}
</style>
</head>
<body>
<div class="app" id="app">

  <!-- header -->
  <div class="hdr">
    <div class="hdr-row">
      <div>
        <div class="hdr-greeting" id="hdr-date"></div>
        <div class="hdr-title">Hey, Soph — <span id="hdr-ac">Today</span></div>
      </div>
      <div class="hdr-right">
        <button class="icon-btn" id="search-btn" onclick="toggleSearch()" title="Search">🔍</button>
      </div>
    </div>
    <div class="search-bar" id="search-bar" style="display:none">
      <span class="search-icon">🔍</span>
      <input id="search-inp" placeholder="Search tasks…" oninput="renderList()" autocomplete="off"/>
    </div>
  </div>

  <!-- scroll -->
  <div class="scroll" id="scroll"></div>

  <!-- bottom nav -->
  <nav class="bottom-nav" id="bottom-nav">
    <button class="nav-item active" data-tab="today"  onclick="switchTab('today')">
      <div class="nav-icon">☀️</div>
      <div class="nav-label">Today</div>
      <div class="nav-active-dot"></div>
    </button>
    <button class="nav-item" data-tab="work"   onclick="switchTab('work')">
      <div class="nav-icon">💼</div>
      <div class="nav-label">Work</div>
      <div class="nav-active-dot"></div>
    </button>
    <button class="nav-item" data-tab="admin"  onclick="switchTab('admin')">
      <div class="nav-icon">📋</div>
      <div class="nav-label">Admin</div>
      <div class="nav-active-dot"></div>
    </button>
    <button class="nav-item" data-tab="groc"   onclick="switchTab('groc')">
      <div class="nav-icon">🛒</div>
      <div class="nav-label">Grocery</div>
      <div class="nav-active-dot"></div>
    </button>
    <button class="nav-item" data-tab="fun"    onclick="switchTab('fun')">
      <div class="nav-icon">✨</div>
      <div class="nav-label">Fun</div>
      <div class="nav-active-dot"></div>
    </button>
  </nav>

</div>

<!-- add bar -->
<div class="add-area" id="add-area">
  <div class="add-pill" id="add-pill">
    <input class="add-inp" id="add-inp" placeholder="Add a task…" onkeydown="handleAddKey(event)" autocomplete="off"/>
    <div class="add-pris">
      <button class="apri h" id="ap-h" onclick="setPri('high')" title="High">!</button>
      <button class="apri"   id="ap-m" onclick="setPri('med')"  title="Medium">–</button>
      <button class="apri"   id="ap-l" onclick="setPri('low')"  title="Low">·</button>
    </div>
    <button class="add-go" onclick="addTask()">+</button>
  </div>
</div>

<!-- edit sheet -->
<div class="overlay" id="sh-edit" onclick="maybeClose(event,'sh-edit')">
  <div class="sheet">
    <div class="sh-handle"></div>
    <div class="sh-title" id="sh-edit-title">Edit task</div>
    <div class="iw">
      <div class="il">Task</div>
      <input type="text" class="inp" id="et" placeholder="Task title…"/>
    </div>
    <div class="iw">
      <div class="il">Priority</div>
      <div class="pri-row">
        <button class="po sh" id="ep-h" onclick="setEPri('high')">🔴 High</button>
        <button class="po"    id="ep-m" onclick="setEPri('med')">🟠 Medium</button>
        <button class="po"    id="ep-l" onclick="setEPri('low')">⚪ Low</button>
      </div>
    </div>
    <div class="iw">
      <div class="il">Due date <span style="color:var(--ink4);font-weight:400;text-transform:none;letter-spacing:0;font-size:12px">optional</span></div>
      <input type="date" class="inp" id="edu"/>
    </div>
    <div class="iw">
      <div class="il">Repeats <span style="color:var(--ink4);font-weight:400;text-transform:none;letter-spacing:0;font-size:12px">optional</span></div>
      <div class="rec-opts">
        <button class="rec-opt sel" id="rec-none"   onclick="setRec('none')">Never</button>
        <button class="rec-opt"     id="rec-daily"  onclick="setRec('daily')">Daily</button>
        <button class="rec-opt"     id="rec-weekly" onclick="setRec('weekly')">Weekly</button>
        <button class="rec-opt"     id="rec-monthly" onclick="setRec('monthly')">Monthly</button>
      </div>
    </div>
    <div class="iw">
      <div class="il">Notes <span style="color:var(--ink4);font-weight:400;text-transform:none;letter-spacing:0;font-size:12px">optional</span></div>
      <textarea class="inp" id="en" placeholder="Any extra details…" rows="2"></textarea>
    </div>
    <div class="btn-row">
      <button class="bsp g" onclick="closeSheet('sh-edit')">Cancel</button>
      <button class="bsp p" style="flex:1" onclick="saveEdit()">Save</button>
    </div>
    <button class="del" onclick="deleteTask()">Delete task</button>
  </div>
</div>

<div id="cw" style="position:fixed;inset:0;pointer-events:none;z-index:300;overflow:hidden"></div>
<div class="toast" id="toast"><div class="toast-t" id="toast-t"></div><div class="toast-s" id="toast-s"></div></div>

<script>
'use strict';
const SK = 'soph-v2';

const TABS = {
  today:{ label:'Today',   emoji:'☀️',  ac:'#e05c3a', acL:'#f07050', bg:'#fef3ef' },
  work: { label:'Work',    emoji:'💼',  ac:'#3d6b9e', acL:'#5a88bc', bg:'#eef3f9' },
  admin:{ label:'Admin',   emoji:'📋',  ac:'#c4714a', acL:'#d4836a', bg:'#fdf5f0' },
  groc: { label:'Grocery', emoji:'🛒',  ac:'#4a8a5a', acL:'#5aa06a', bg:'#eef5f0' },
  fun:  { label:'Fun',     emoji:'✨',  ac:'#8a5aaa', acL:'#a070c8', bg:'#f4eff9' },
};

// task: {id,title,note,priority,done,dueDate,recur,tab,createdAt,completedAt}
let tasks = [];
let currentTab = 'today';
let addPri = 'high';
let editId = null;
let ePri = 'high';
let eRec = 'none';
let doneOpen = {};
let searchOpen = false;

// ── storage ──────────────────────────────────────────
function persist() { try{localStorage.setItem(SK,JSON.stringify({tasks,doneOpen}))}catch{} }
function hydrate() {
  try {
    const s=JSON.parse(localStorage.getItem(SK));
    if(s){ tasks=s.tasks||[]; doneOpen=s.doneOpen||{}; }
  } catch {}
  // Tick recurring tasks into today
  spawnRecurring();
}

// ── recurring spawn ───────────────────────────────────
function spawnRecurring() {
  const todayStr = todayISO();
  tasks.forEach(t => {
    if (!t.recur || t.recur==='none') return;
    if (!t.done || !t.completedAt) return;
    const completed = new Date(t.completedAt);
    const now = new Date();
    let shouldRespawn = false;
    if (t.recur==='daily'   && diffDays(completed,now)>=1) shouldRespawn=true;
    if (t.recur==='weekly'  && diffDays(completed,now)>=7) shouldRespawn=true;
    if (t.recur==='monthly' && diffDays(completed,now)>=28) shouldRespawn=true;
    if (shouldRespawn) {
      t.done=false; t.completedAt=null;
      if (t.recur==='daily')   t.dueDate=todayStr;
      if (t.recur==='weekly')  t.dueDate=addDays(todayStr,7);
      if (t.recur==='monthly') t.dueDate=addDays(todayStr,30);
    }
  });
}
function diffDays(a,b) { return Math.floor((b-a)/86400000); }
function todayISO() { return new Date().toISOString().slice(0,10); }
function addDays(iso,n) { const d=new Date(iso); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }

// ── theme ─────────────────────────────────────────────
function applyTheme(tab) {
  const t=TABS[tab]||TABS.today;
  const r=document.documentElement;
  r.style.setProperty('--ac',t.ac);
  r.style.setProperty('--acL',t.acL);
  r.style.setProperty('--ac-bg',t.bg);
  document.getElementById('hdr-ac').textContent=t.label;
  document.querySelector('meta[name=theme-color]')?.setAttribute('content',t.bg);
}

// ── tab switch ────────────────────────────────────────
function switchTab(tab) {
  currentTab=tab;
  applyTheme(tab);
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
  renderList();
  document.getElementById('add-pill').classList.toggle('hidden', tab==='today');
}

// ── get tasks for view ────────────────────────────────
function getViewTasks() {
  const today=todayISO();
  const q=(document.getElementById('search-inp')?.value||'').toLowerCase().trim();

  if (currentTab==='today') {
    return tasks.filter(t => {
      if (q && !t.title.toLowerCase().includes(q) && !(t.note||'').toLowerCase().includes(q)) return false;
      if (t.done && t.completedAt) {
        // hide done tasks completed > 1 day ago from today view
        if (diffDays(new Date(t.completedAt), new Date()) > 1) return false;
      }
      return !t.done
        ? (!t.dueDate || t.dueDate<=addDays(today,1))
        : t.completedAt && diffDays(new Date(t.completedAt),new Date())<=1;
    });
  }
  return tasks.filter(t => {
    if (t.tab!==currentTab) return false;
    if (q && !t.title.toLowerCase().includes(q) && !(t.note||'').toLowerCase().includes(q)) return false;
    return true;
  });
}

// ── render ────────────────────────────────────────────
function renderAll() {
  applyTheme(currentTab);
  renderNav();
  renderList();
  renderAddBar();
}

function renderNav() {
  const today=todayISO();
  document.querySelectorAll('.nav-item').forEach(btn=>{
    const tab=btn.dataset.tab;
    btn.classList.toggle('active',tab===currentTab);
    // remove old badge
    btn.querySelector('.nav-badge')?.remove();
    if (tab==='today') {
      const n=tasks.filter(t=>!t.done&&(!t.dueDate||t.dueDate<=today)).length;
      if(n>0){const b=document.createElement('div');b.className='nav-badge';b.textContent=n;btn.appendChild(b);}
    } else if (tab!=='today') {
      const n=tasks.filter(t=>t.tab===tab&&!t.done).length;
      if(n>0){const b=document.createElement('div');b.className='nav-badge';b.textContent=n;btn.appendChild(b);}
    }
  });
}

function renderList() {
  const area=document.getElementById('scroll');
  const all=getViewTasks();
  const today=todayISO();

  if (currentTab==='today') {
    // Stats
    const overdue=tasks.filter(t=>!t.done&&t.dueDate&&t.dueDate<today).length;
    const dueToday=tasks.filter(t=>!t.done&&t.dueDate===today).length;
    const pending=tasks.filter(t=>!t.done&&(!t.dueDate||t.dueDate<=today)).length;
    const doneCt=tasks.filter(t=>t.done&&t.completedAt&&diffDays(new Date(t.completedAt),new Date())<=1).length;

    let html=`<div class="today-meta fade-up">
      <div class="meta-card">
        <div class="meta-n${pending>0?' hot':''}">${pending}</div>
        <div class="meta-l">To do today</div>
      </div>
      <div class="meta-card">
        <div class="meta-n">${doneCt}</div>
        <div class="meta-l">Done today</div>
      </div>
      <div class="meta-card">
        <div class="meta-n${overdue>0?' hot':''}">${overdue}</div>
        <div class="meta-l">Overdue</div>
      </div>
    </div>`;

    // Group by source list
    const tabOrder=['work','admin','groc','fun'];
    const pending_tasks=all.filter(t=>!t.done);
    const done_tasks=all.filter(t=>t.done);

    if (pending_tasks.length===0 && done_tasks.length===0) {
      html+=`<div class="empty"><div class="empty-em">☀️</div><div class="empty-t">All clear, Soph!</div><div class="empty-s">Nothing on your plate today.</div></div>`;
    } else {
      // Group pending by tab
      tabOrder.forEach(tab=>{
        const group=pending_tasks.filter(t=>t.tab===tab);
        if(!group.length) return;
        const tc=TABS[tab];
        html+=`<div class="sec-hdr">
          <div class="sec-title"><span class="sec-em">${tc.emoji}</span>${tc.label}</div>
        </div>`;
        html+=group.map(t=>taskHtml(t)).join('');
      });
      // Also uncategorised (shouldn't happen but safety)
      const uncat=pending_tasks.filter(t=>!t.tab);
      if(uncat.length){ html+=uncat.map(t=>taskHtml(t)).join(''); }

      // Done section
      if(done_tasks.length){
        const isOpen=doneOpen['today']||false;
        html+=`<div class="done-section">
          <button class="done-toggle" onclick="toggleDone()">
            <span class="done-arr${isOpen?' open':''}">›</span>
            Done today
            <span class="done-count">${done_tasks.length}</span>
          </button>
          <div class="done-body${isOpen?' open':''}">${done_tasks.map(t=>taskHtml(t)).join('')}</div>
        </div>`;
      }
    }

    area.innerHTML=html;
    return;
  }

  // Normal list tab
  const pending=all.filter(t=>!t.done);
  const done=all.filter(t=>t.done);
  const isOpen=doneOpen[currentTab]||false;

  if(all.length===0){
    area.innerHTML=`<div class="empty fade-up">
      <div class="empty-em">${TABS[currentTab].emoji}</div>
      <div class="empty-t">Nothing here yet</div>
      <div class="empty-s">Tap the bar below to add your first task</div>
    </div>`;
    return;
  }

  let html=pending.map(t=>taskHtml(t)).join('');

  if(done.length){
    html+=`<div class="done-section">
      <button class="done-toggle" onclick="toggleDone()">
        <span class="done-arr${isOpen?' open':''}">›</span>
        Done
        <span class="done-count">${done.length}</span>
      </button>
      <div class="done-body${isOpen?' open':''}" id="done-body">
        ${done.map(t=>taskHtml(t)).join('')}
        <button class="clear-btn" onclick="clearDone()">🗑 Clear all done</button>
      </div>
    </div>`;
  }

  area.innerHTML=html;
  initDrag();
}

function taskHtml(t) {
  const today=todayISO();
  // chips
  let chips='';
  if(t.dueDate){
    const isToday=t.dueDate===today;
    const isOver=!t.done&&t.dueDate<today;
    const label=isOver?'Overdue':isToday?'Today':fmtDate(t.dueDate);
    chips+=`<span class="task-chip chip-due${isToday?' today-due':''}${isOver?' overdue':''}">${isOver?'⚠️ ':'📅 '}${label}</span>`;
  }
  if(t.recur&&t.recur!=='none'){
    chips+=`<span class="task-chip chip-rec">🔄 ${t.recur}</span>`;
  }
  if(currentTab==='today'&&t.tab){
    chips+=`<span class="task-chip chip-${t.tab}">${TABS[t.tab]?.emoji||''} ${TABS[t.tab]?.label||''}</span>`;
  }
  const noteHtml=t.note?`<div class="task-note">${t.note}</div>`:'';
  const subHtml=(chips||noteHtml)?`<div class="task-sub">${noteHtml}${chips}</div>`:'';

  return `<div class="task-wrap fade-up" id="wrap-${t.id}">
    <div class="swipe-bg-left"><span class="swipe-icon">✓</span></div>
    <div class="swipe-bg-right"><span class="swipe-icon">🗑</span></div>
    <div class="task p-${t.priority} tab-${t.tab}${t.done?' done':''}" id="task-${t.id}" data-id="${t.id}">
      <div class="task-inner">
        <span class="task-drag-handle" data-drag="${t.id}">⠿</span>
        <div class="task-check" onclick="toggleTask('${t.id}')">
          <svg class="task-tick" width="12" height="9" viewBox="0 0 12 9" fill="none">
            <path d="M1 4.5l3.5 3.5L11 1" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="task-body">
          <div class="task-title">${t.title}</div>
          ${subHtml}
        </div>
        <button class="task-more" onclick="openEdit('${t.id}')">…</button>
      </div>
    </div>
  </div>`;
}

function renderAddBar() {
  ['h','m','l'].forEach(x=>{
    const el=document.getElementById(`ap-${x}`);
    if(!el) return;
    const map={h:'high',m:'med',l:'low'};
    el.className=`apri${addPri===map[x]?' '+x:''}`;
  });
}

// ── add task ──────────────────────────────────────────
function handleAddKey(e){ if(e.key==='Enter') addTask(); }

function addTask() {
  const inp=document.getElementById('add-inp');
  const title=inp.value.trim();
  if(!title){inp.focus();return;}
  tasks.unshift({
    id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),
    title, note:'', priority:addPri||'high', done:false,
    dueDate:'', recur:'none',
    tab:currentTab==='today'?'work':currentTab,
    createdAt:Date.now(), completedAt:null
  });
  inp.value='';
  persist();
  renderAll();
  inp.focus();
}

function setPri(p){
  addPri=p;
  renderAddBar();
}

// ── toggle done ───────────────────────────────────────
function toggleTask(id) {
  const t=tasks.find(x=>x.id===id);
  if(!t) return;
  t.done=!t.done;
  t.completedAt=t.done?new Date().toISOString():null;
  persist();
  // burst animation
  const check=document.querySelector(`#task-${id} .task-check`);
  if(check&&t.done){ check.classList.add('burst'); setTimeout(()=>check.classList.remove('burst'),350); }
  // check if list cleared
  const tab=t.tab||currentTab;
  const remaining=tasks.filter(x=>x.tab===tab&&!x.done).length;
  if(t.done&&remaining===0) listComplete(tab);
  renderAll();
}

function listComplete(tab) {
  const t=TABS[tab]||TABS.work;
  showToast(`${t.emoji} ${t.label} all done!`,'Nice work, Soph 🥂');
  confetti();
}

function toggleDone() {
  doneOpen[currentTab]=!doneOpen[currentTab];
  persist();
  renderList();
}

function clearDone() {
  if(currentTab==='today'){
    tasks=tasks.filter(t=>!t.done||!t.completedAt||diffDays(new Date(t.completedAt),new Date())>1);
  } else {
    tasks=tasks.filter(t=>t.tab!==currentTab||!t.done);
  }
  persist();
  renderAll();
}

// ── edit ──────────────────────────────────────────────
function openEdit(id) {
  editId=id;
  const t=tasks.find(x=>x.id===id);
  if(!t) return;
  document.getElementById('et').value=t.title;
  document.getElementById('en').value=t.note||'';
  document.getElementById('edu').value=t.dueDate||'';
  ePri=t.priority; eRec=t.recur||'none';
  setEPri(ePri); setRec(eRec);
  const isNew=!t.title;
  document.getElementById('sh-edit-title').textContent=isNew?'New task':'Edit task';
  openSheet('sh-edit');
  setTimeout(()=>document.getElementById('et').focus(),350);
}

function setEPri(p){
  ePri=p;
  ['h','m','l'].forEach(x=>{
    const el=document.getElementById(`ep-${x}`);
    if(!el) return;
    const map={h:'high',m:'med',l:'low'};
    el.className='po'+(ePri===map[x]?` s${x}`:'');
  });
}

function setRec(r){
  eRec=r;
  ['none','daily','weekly','monthly'].forEach(x=>{
    const el=document.getElementById(`rec-${x}`);
    if(el) el.classList.toggle('sel',x===r);
  });
}

function saveEdit() {
  const t=tasks.find(x=>x.id===editId);
  if(!t) return;
  t.title=document.getElementById('et').value.trim()||t.title;
  t.note=document.getElementById('en').value.trim();
  t.dueDate=document.getElementById('edu').value||'';
  t.priority=ePri; t.recur=eRec;
  persist();
  closeSheet('sh-edit');
  renderAll();
}

function deleteTask() {
  tasks=tasks.filter(x=>x.id!==editId);
  persist();
  closeSheet('sh-edit');
  renderAll();
}

// ── swipe gestures ────────────────────────────────────
let swipeEl=null,swipeStart=0,swipeX=0;

document.addEventListener('touchstart',e=>{
  const task=e.target.closest('.task');
  if(!task||e.target.closest('.task-check')||e.target.closest('.task-more')||e.target.closest('.task-drag-handle')) return;
  swipeEl=task;
  swipeStart=e.touches[0].clientX;
  swipeX=0;
},{passive:true});

document.addEventListener('touchmove',e=>{
  if(!swipeEl) return;
  swipeX=e.touches[0].clientX-swipeStart;
  const wrap=swipeEl.closest('.task-wrap');
  if(!wrap) return;
  if(Math.abs(swipeX)>8){
    swipeEl.style.transform=`translateX(${swipeX*0.7}px)`;
    swipeEl.style.transition='none';
    const left=wrap.querySelector('.swipe-bg-left');
    const right=wrap.querySelector('.swipe-bg-right');
    if(left)  left.style.opacity=swipeX>0?Math.min(swipeX/60,1):0;
    if(right) right.style.opacity=swipeX<0?Math.min(-swipeX/60,1):0;
  }
},{passive:true});

document.addEventListener('touchend',()=>{
  if(!swipeEl) return;
  swipeEl.style.transition='';
  swipeEl.style.transform='';
  const wrap=swipeEl.closest('.task-wrap');
  if(wrap){
    wrap.querySelector('.swipe-bg-left') && (wrap.querySelector('.swipe-bg-left').style.opacity=0);
    wrap.querySelector('.swipe-bg-right') && (wrap.querySelector('.swipe-bg-right').style.opacity=0);
  }
  if(swipeX>70)  { const id=swipeEl.dataset.id; if(id) { swipeEl=null; swipeX=0; toggleTask(id); return; } }
  if(swipeX<-70) { const id=swipeEl.dataset.id; if(id) { tasks=tasks.filter(x=>x.id!==id); persist(); renderAll(); } }
  swipeEl=null; swipeX=0;
});

// ── drag to reorder ───────────────────────────────────
let dragId=null,dragEl=null,dragStartY=0,dragTabTasks=[];

function initDrag(){
  document.querySelectorAll('[data-drag]').forEach(handle=>{
    handle.addEventListener('touchstart',e=>{
      e.stopPropagation();
      dragId=handle.dataset.drag;
      dragEl=handle.closest('.task-wrap');
      if(!dragEl) return;
      dragStartY=e.touches[0].clientY;
      dragEl.querySelector('.task')?.classList.add('dragging');
      dragTabTasks=currentTab==='today'
        ? tasks.filter(t=>!t.done)
        : tasks.filter(t=>t.tab===currentTab&&!t.done);
    },{passive:true});
  });
}

document.addEventListener('touchmove',e=>{
  if(!dragEl) return;
  const dy=e.touches[0].clientY-dragStartY;
  dragEl.style.transform=`translateY(${dy}px)`;
  dragEl.style.transition='none';
  dragEl.style.zIndex=50;
},{passive:true});

document.addEventListener('touchend',e=>{
  if(!dragEl) return;
  dragEl.querySelector('.task')?.classList.remove('dragging');
  dragEl.style.transform='';
  dragEl.style.transition='';
  dragEl.style.zIndex='';
  dragEl=null; dragId=null;
  persist(); renderList();
});

// ── search ────────────────────────────────────────────
function toggleSearch(){
  searchOpen=!searchOpen;
  const bar=document.getElementById('search-bar');
  bar.style.display=searchOpen?'flex':'none';
  if(searchOpen) setTimeout(()=>document.getElementById('search-inp').focus(),100);
  else { document.getElementById('search-inp').value=''; renderList(); }
}

// ── sheets ────────────────────────────────────────────
function openSheet(id){ document.getElementById(id).classList.add('open'); document.body.style.overflow='hidden'; }
function closeSheet(id){ document.getElementById(id).classList.remove('open'); document.body.style.overflow=''; }
function maybeClose(e,id){ if(e.target===document.getElementById(id)) closeSheet(id); }

// ── toast + confetti ──────────────────────────────────
function showToast(title,sub=''){
  const t=document.getElementById('toast');
  document.getElementById('toast-t').textContent=title;
  document.getElementById('toast-s').textContent=sub;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2800);
}

function confetti(){
  const w=document.getElementById('cw'); w.innerHTML='';
  const cols=['#e05c3a','#3d6b9e','#4a8a5a','#8a5aaa','#c4714a','#e09030'];
  for(let i=0;i<50;i++){
    const el=document.createElement('div'); el.className='cp';
    const sz=Math.random()*8+4;
    el.style.cssText=`left:${Math.random()*100}%;width:${sz}px;height:${sz*1.5}px;background:${cols[i%6]};border-radius:${Math.random()>.5?'50%':'2px'};animation:cf ${.7+Math.random()*.9}s linear ${Math.random()*.5}s both`;
    w.appendChild(el);
  }
  setTimeout(()=>w.innerHTML='',3000);
}

// ── date format ───────────────────────────────────────
function fmtDate(iso){
  if(!iso) return '';
  const d=new Date(iso+'T00:00:00');
  return d.toLocaleDateString('en-AU',{day:'numeric',month:'short'});
}

// ── header date ───────────────────────────────────────
function setHdrDate(){
  document.getElementById('hdr-date').textContent=
    new Date().toLocaleDateString('en-AU',{weekday:'long',day:'numeric',month:'long'});
}

// ── hide add bar when scrolling ───────────────────────
let lastScroll=0;
document.getElementById('scroll').addEventListener('scroll',function(){
  const cur=this.scrollTop;
  const pill=document.getElementById('add-pill');
  if(currentTab==='today'||!pill) return;
  pill.classList.toggle('hidden',cur>lastScroll&&cur>60);
  lastScroll=cur;
},{passive:true});

// ── init ──────────────────────────────────────────────
hydrate();
setHdrDate();
setPri('high');
renderAll();

// Refresh recurring daily
setInterval(()=>{ spawnRecurring(); renderAll(); }, 60*60*1000);
</script>
</body>
</html>
